- name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ➕ 加入這個步驟安裝所需的第三方套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper
        run: |
          python scraper.py
