name: Daily Scrape

on:
  workflow_dispatch:
  schedule:
    # 每日香港時間 06:00 (UTC 22:00) 自動執行
    - cron: '0 22 * * *'

# 授權 Actions 讀寫 Repo 權限（解決 Exit code 128）
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 安裝所需套件（解決 ModuleNotFoundError / Exit code 1）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper
        run: |
          python scraper.py

      # 自動 Commit 並 Push 生成的 data.json 回 Repo
      - name: Commit and Push data.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Auto: update data.json [skip ci]" || exit 0
          git push
