name: Monthly Gospel Scraper

on:
  schedule:
    #  UTC 時間每月 1 號 00:00，等於 UTC+8（香港/台灣）每月 1 號 08:00
    # 如果要香港時間 1 號 00:00 執行，UTC 請設定為前一天 16:00 (cron: '0 16 31,28,29,30 * *' 較複雜，建議用 UTC 00:00)
    - cron: '0 0 1 * *'
  workflow_dispatch: # 支援在 GitHub 介面手動觸發執行

jobs:
  scrape-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push Updated data.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Update monthly data.json" && git push)
