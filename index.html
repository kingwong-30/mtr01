<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>康城站即時列車及資訊儀表板</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --highlight-color: #f59e0b;
            --mtr-purple: #8b5cf6;
            --inbound-color: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* 每日聖言卡片 */
        .scripture-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border-color: #4338ca;
        }

        .scripture-title {
            font-size: 0.8rem;
            color: #a5b4fc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scripture-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e0e7ff;
            font-weight: 400;
        }

        .scripture-ref {
            font-size: 0.8rem;
            color: #818cf8;
            margin-top: 8px;
            text-align: right;
            font-style: italic;
            font-weight: 600;
        }

        /* 天氣資訊卡片 */
        .weather-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .weather-icon {
            font-size: 2.2rem;
        }

        .temp-display {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .weather-details {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* 港鐵卡片 */
        .mtr-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mtr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .station-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .station-badge {
            background-color: var(--mtr-purple);
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .update-time {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* 方向分組標題 */
        .direction-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .direction-label.inbound {
            color: var(--inbound-color);
        }

        .train-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .train-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 第一班車 */
        .train-item.first-train {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .train-item.first-train.inbound-bg {
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .train-dest {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .train-plat {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .train-time-wrap {
            text-align: right;
        }

        .first-train .train-time {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1;
        }

        .first-train.inbound-bg .train-time {
            color: var(--inbound-color);
        }

        .first-train .train-unit {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-left: 2px;
        }

        .first-train.inbound-bg .train-unit {
            color: var(--inbound-color);
        }

        /* 第二班車 */
        .train-item.second-train {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .second-train .train-dest {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0;
        }

        .second-train .train-time {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .second-train .train-unit {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .divider {
            height: 1px;
            background-color: var(--card-border);
            margin: 4px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 每日天主聖言 (實時網絡 API 抓取聖瑪竇福音) -->
        <div class="card scripture-card">
            <div class="scripture-title">
                <span>✝️ Daily Gospel</span>
                <span style="font-size:0.7rem; opacity:0.8;">Saint Matthew</span>
            </div>
            <div id="scripture" class="scripture-content">即時載入每日福音中...</div>
            <div id="scripture-ref" class="scripture-ref"></div>
        </div>

        <!-- 天氣資訊 -->
        <div class="card weather-card">
            <div class="weather-info">
                <div id="weather-icon" class="weather-icon">🌤️</div>
                <div id="temp" class="temp-display">--°C</div>
            </div>
            <div class="weather-details">
                <div>將軍澳天氣</div>
                <div>相對濕度: <span id="humidity">--%</span></div>
            </div>
        </div>

        <!-- 康城站列車資訊 -->
        <div class="card mtr-card">
            <div class="mtr-header">
                <div class="station-title">
                    康城站 <span class="station-badge">將軍澳綫</span>
                </div>
                <div id="updated" class="update-time">最後更新時間 --:--:--</div>
            </div>

            <!-- 往市區方向 (離站) -->
            <div class="train-section">
                <div class="direction-label">
                    <span>🚆 往 調景嶺 / 北角 方向</span>
                </div>
                <div class="train-list">
                    <div class="train-item first-train">
                        <div>
                            <div id="dest_down1" class="train-dest">載入中...</div>
                            <div id="plat_down1" class="train-plat">-- 號月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_down1" class="train-time">--</span>
                            <span id="unit_down1" class="train-unit"></span>
                        </div>
                    </div>
                    <div class="train-item second-train">
                        <div>
                            <div id="dest_down2" class="train-dest">載入中...</div>
                            <div id="plat_down2" class="train-plat">-- 號月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_down2" class="train-time">--</span>
                            <span id="unit_down2" class="train-unit"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <!-- 由調景嶺往康城列車 (抵站) -->
            <div class="train-section">
                <div class="direction-label inbound">
                    <span>🏁 由調景嶺往康城列車</span>
                </div>
                <div class="train-list">
                    <div class="train-item first-train inbound-bg">
                        <div>
                            <div id="dest_up1" class="train-dest">載入中...</div>
                            <div id="plat_up1" class="train-plat">-- 號月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_up1" class="train-time">--</span>
                            <span id="unit_up1" class="train-unit"></span>
                        </div>
                    </div>
                    <div class="train-item second-train">
                        <div>
                            <div id="dest_up2" class="train-dest">載入中...</div>
                            <div id="plat_up2" class="train-plat">-- 號月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_up2" class="train-time">--</span>
                            <span id="unit_up2" class="train-unit"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局控制變數
        let firstDownTargetTime = null;
        let firstUpTargetTime = null;
        let isFirstDownArriving = false;
        let isFirstUpArriving = false;
        let timeOffset = 0; // 校正裝置與港鐵伺服器時間差
        let fetchIntervalId = null;

        // 瑪竇福音每日經文讀本輪替清單
        const matthewPassages = [
            "1:21", "2:11", "3:17", "4:4", "4:19", "5:3-12", "5:14-16", "5:44", "6:9-13", "6:26", 
            "6:33-34", "7:7-8", "7:12", "7:24", "8:10", "8:26", "9:12-13", "9:37-38", "10:8", "10:31", 
            "11:28-30", "12:8", "13:31-32", "14:27", "15:28", "16:16", "16:24", "17:20", "18:20", "19:14", 
            "20:28", "21:22", "22:37-39", "23:12", "24:35", "25:40", "26:26-28", "26:41", "28:18-20"
        ];

        // 實時向開放聖經 API (bible-api.com) 請求當天的聖瑪竇福音經文
        async function fetchDailyMatthewGospel() {
            const scriptureElem = document.getElementById('scripture');
            const refElem = document.getElementById('scripture-ref');

            try {
                const now = new Date();
                const start = new Date(now.getFullYear(), 0, 0);
                const diff = now - start;
                const oneDay = 1000 * 60 * 60 * 24;
                const dayOfYear = Math.floor(diff / oneDay);

                const passageRef = matthewPassages[dayOfYear % matthewPassages.length];
                
                const response = await fetch(`https://bible-api.com/matthew+${passageRef}?translation=web`);
                if (!response.ok) throw new Error('API Response Error');
                
                const data = await response.json();

                if (data && data.text) {
                    const cleanText = data.text.replace(/\n/g, ' ').trim();
                    scriptureElem.innerText = `"${cleanText}"`;
                    refElem.innerText = `— ${data.reference} (Gospel of Saint Matthew)`;
                } else {
                    throw new Error('Invalid Data Structure');
                }
            } catch (error) {
                console.warn('Realtime Gospel API Fetch failed, loading fallback:', error);
                scriptureElem.innerText = '"Come to me, all you that are weary and are carrying heavy burdens, and I will give you rest."';
                refElem.innerText = '— Matthew 11:28 (Gospel of Saint Matthew)';
            }
        }

        // 天氣圖示對應邏輯
        function getHKOEmoji(iconCode) {
            const iconMap = {
                50: "☀️", 51: "⛅", 52: "⛅", 53: "🌤️", 54: "⛅",
                60: "☁️", 61: "☁️", 62: "🌧️", 63: "🌧️", 64: "🌧️",
                65: "⛈️", 70: "🌙", 71: "🌙", 72: "🌙", 73: "🌙",
                74: "🌙", 75: "🌙", 76: "🌤️", 77: "⛈️", 80: "💨",
                81: "🌵", 82: "💧", 83: "🌫️", 84: "🌫️", 85: "🌫️"
            };
            return iconMap[iconCode] || "🌤️";
        }

        // 抓取香港天文台即時天氣
        async function fetchHKOWeather() {
            try {
                const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await response.json();
                
                if (data) {
                    if (data.temperature && data.temperature.data) {
                        const tkoTemp = data.temperature.data.find(t => t.place.includes('將軍澳')) || data.temperature.data[0];
                        const tempElem = document.getElementById('temp');
                        if (tempElem) tempElem.innerText = `${tkoTemp.value}°C`;
                    }
                    
                    if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
                        const humElem = document.getElementById('humidity');
                        if (humElem) humElem.innerText = `${data.humidity.data[0].value}%`;
                    }

                    if (data.icon && data.icon.length > 0) {
                        const iconCode = data.icon[0];
                        const emoji = getHKOEmoji(iconCode);
                        const iconElem = document.getElementById('weather-icon');
                        if (iconElem) iconElem.innerText = emoji;
                    }
                }
            } catch (error) {
                console.error('HKO Weather Fetch Error:', error);
            }
        }

        const destNames = {
            'NOP': '往 北角',
            'TIK': '往 調景嶺',
            'LHP': '往 康城',
            'TKO': '往 將軍澳'
        };

        // 統一以分鐘顯示時間
        function updateCountdownUI(targetTime, isArriving, ttntElemId, unitElemId) {
            if (isArriving) {
                document.getElementById(ttntElemId).innerText = '即將到站';
                document.getElementById(unitElemId).innerText = '';
                return;
            }
            if (!targetTime) return;

            const now = Date.now() + timeOffset;
            const diffSec = Math.floor((targetTime - now) / 1000);

            if (diffSec <= 0) {
                document.getElementById(ttntElemId).innerText = '即將到站';
                document.getElementById(unitElemId).innerText = '';
            } else {
                const mins = Math.ceil(diffSec / 60);
                document.getElementById(ttntElemId).innerText = mins;
                document.getElementById(unitElemId).innerText = '分';
            }
        }

        function tickFirstTrainCountdown() {
            if (firstDownTargetTime && !isFirstDownArriving) {
                updateCountdownUI(firstDownTargetTime, isFirstDownArriving, 'ttnt_down1', 'unit_down1');
            }
            if (firstUpTargetTime && !isFirstUpArriving) {
                updateCountdownUI(firstUpTargetTime, isFirstUpArriving, 'ttnt_up1', 'unit_up1');
            }
        }

        async function fetchMTRData() {
            try {
                const requestStartTime = Date.now();
                
                const [resLHP, resTKO, resTIK] = await Promise.all([
                    fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP').then(r => r.json()).catch(() => null),
                    fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=TKO').then(r => r.json()).catch(() => null),
                    fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=TIK').then(r => r.json()).catch(() => null)
                ]);

                const requestEndTime = Date.now();
                const rtt = requestEndTime - requestStartTime;

                if (resLHP && resLHP.curr_time) {
                    const serverTimeStr = resLHP.curr_time.replace(/-/g, '/') + ' +0800';
                    const serverMs = new Date(serverTimeStr).getTime();
                    
                    timeOffset = (serverMs + (rtt / 2)) - Date.now();
                    
                    const timeOnly = resLHP.curr_time.split(' ')[1];
                    document.getElementById('updated').innerText = `最後更新時間 ${timeOnly}`;
                }

                // --- 1. 處理往市區方向列車 (DOWN) ---
                if (resLHP && resLHP.status === 1 && resLHP.data['TKL-LHP']) {
                    const mtrData = resLHP.data['TKL-LHP'];

                    if (mtrData.DOWN && mtrData.DOWN.length > 0) {
                        const downTrains = mtrData.DOWN;

                        // 第一班車
                        const firstDown = downTrains[0];
                        document.getElementById('dest_down1').innerText = destNames[firstDown.dest] || `往 ${firstDown.dest}`;
                        document.getElementById('plat_down1').innerText = `${firstDown.plat} 號月台`;

                        if (firstDown.ttnt === '0' || firstDown.ttnt === '') {
                            firstDownTargetTime = null;
                            isFirstDownArriving = true;
                            document.getElementById('ttnt_down1').innerText = '即將到站';
                            document.getElementById('unit_down1').innerText = '';
                        } else if (firstDown.time) {
                            isFirstDownArriving = false;
                            const targetTimeStr = firstDown.time.replace(/-/g, '/') + ' +0800';
                            firstDownTargetTime = new Date(targetTimeStr).getTime();
                            updateCountdownUI(firstDownTargetTime, false, 'ttnt_down1', 'unit_down1');
                        }

                        // 第二班車
                        if (downTrains.length > 1) {
                            const secondDown = downTrains[1];
                            document.getElementById('dest_down2').innerText = destNames[secondDown.dest] || `往 ${secondDown.dest}`;
                            document.getElementById('plat_down2').innerText = `${secondDown.plat} 號月台`;
                            
                            if (secondDown.ttnt === '0') {
                                document.getElementById('ttnt_down2').innerText = '即將到站';
                                document.getElementById('unit_down2').innerText = '';
                            } else {
                                document.getElementById('ttnt_down2').innerText = secondDown.ttnt;
                                document.getElementById('unit_down2').innerText = '分';
                            }
                        } else {
                            document.getElementById('dest_down2').innerText = '暫無下班車';
                            document.getElementById('plat_down2').innerText = '';
                            document.getElementById('ttnt_down2').innerText = '--';
                            document.getElementById('unit_down2').innerText = '';
                        }
                    } else {
                        document.getElementById('dest_down1').innerText = '暫無班次';
                        document.getElementById('ttnt_down1').innerText = '--';
                        document.getElementById('unit_down1').innerText = '';
                        document.getElementById('dest_down2').innerText = '暫無下班車';
                        document.getElementById('ttnt_down2').innerText = '--';
                        document.getElementById('unit_down2').innerText = '';
                    }
                }

                // --- 2. 處理由調景嶺往康城列車 (UP 跨站推算) ---
                let rawUpCandidates = [];

                if (resLHP && resLHP.data && resLHP.data['TKL-LHP'] && resLHP.data['TKL-LHP'].UP) {
                    resLHP.data['TKL-LHP'].UP.forEach(t => {
                        if (t.time) {
                            const targetMs = new Date(t.time.replace(/-/g, '/') + ' +0800').getTime();
                            rawUpCandidates.push({
                                plat: t.plat || '1',
                                targetTime: targetMs,
                                isArriving: t.ttnt === '0',
                                source: 'LHP'
                            });
                        } else if (t.ttnt === '0' || t.ttnt === '') {
                            rawUpCandidates.push({
                                plat: t.plat || '1',
                                targetTime: Date.now() + timeOffset,
                                isArriving: true,
                                source: 'LHP'
                            });
                        }
                    });
                }

                if (resTKO && resTKO.data && resTKO.data['TKL-TKO'] && resTKO.data['TKL-TKO'].UP) {
                    resTKO.data['TKL-TKO'].UP.filter(t => t.dest === 'LHP').forEach(t => {
                        if (t.time) {
                            const tkoMs = new Date(t.time.replace(/-/g, '/') + ' +0800').getTime();
                            rawUpCandidates.push({
                                plat: '1',
                                targetTime: tkoMs + (210 * 1000),
                                isArriving: false,
                                source: 'TKO'
                            });
                        }
                    });
                }

                if (resTIK && resTIK.data && resTIK.data['TKL-TIK'] && resTIK.data['TKL-TIK'].UP) {
                    resTIK.data['TKL-TIK'].UP.filter(t => t.dest === 'LHP').forEach(t => {
                        if (t.time) {
                            const tikMs = new Date(t.time.replace(/-/g, '/') + ' +0800').getTime();
                            rawUpCandidates.push({
                                plat: '1',
                                targetTime: tikMs + (390 * 1000),
                                isArriving: false,
                                source: 'TIK'
                            });
                        }
                    });
                }

                const nowMs = Date.now() + timeOffset;
                rawUpCandidates = rawUpCandidates.filter(c => c.targetTime >= nowMs - 30000);
                rawUpCandidates.sort((a, b) => a.targetTime - b.targetTime);

                const upTrains = [];
                rawUpCandidates.forEach(candidate => {
                    const isDup = upTrains.some(existing => 
                        Math.abs(existing.targetTime - candidate.targetTime) < 90000
                    );
                    if (!isDup) {
                        upTrains.push(candidate);
                    }
                });

                if (upTrains.length > 0) {
                    // 第一班車
                    const firstUp = upTrains[0];
                    document.getElementById('dest_up1').innerText = '往 康城';
                    document.getElementById('plat_up1').innerText = `${firstUp.plat} 號月台`;

                    if (firstUp.isArriving) {
                        firstUpTargetTime = null;
                        isFirstUpArriving = true;
                        document.getElementById('ttnt_up1').innerText = '即將到站';
                        document.getElementById('unit_up1').innerText = '';
                    } else {
                        isFirstUpArriving = false;
                        firstUpTargetTime = firstUp.targetTime;
                        updateCountdownUI(firstUpTargetTime, false, 'ttnt_up1', 'unit_up1');
                    }

                    // 第二班車
                    if (upTrains.length > 1) {
                        const secondUp = upTrains[1];
                        document.getElementById('dest_up2').innerText = '往 康城';
                        document.getElementById('plat_up2').innerText = `${secondUp.plat} 號月台`;

                        const diffSec = Math.floor((secondUp.targetTime - nowMs) / 1000);
                        if (diffSec <= 0 || secondUp.isArriving) {
                            document.getElementById('ttnt_up2').innerText = '即將到站';
                            document.getElementById('unit_up2').innerText = '';
                        } else {
                            const mins = Math.ceil(diffSec / 60);
                            document.getElementById('ttnt_up2').innerText = mins;
                            document.getElementById('unit_up2').innerText = '分';
                        }
                    } else {
                        document.getElementById('dest_up2').innerText = '暫無下班車';
                        document.getElementById('plat_up2').innerText = '';
                        document.getElementById('ttnt_up2').innerText = '--';
                        document.getElementById('unit_up2').innerText = '';
                    }
                } else {
                    document.getElementById('dest_up1').innerText = '暫無抵站列車';
                    document.getElementById('plat_up1').innerText = '';
                    document.getElementById('ttnt_up1').innerText = '--';
                    document.getElementById('unit_up1').innerText = '';

                    document.getElementById('dest_up2').innerText = '暫無下班車';
                    document.getElementById('plat_up2').innerText = '';
                    document.getElementById('ttnt_up2').innerText = '--';
                    document.getElementById('unit_up2').innerText = '';
                }

            } catch (error) {
                console.error('MTR Fetch Error:', error);
            }
        }

        function startIntervals() {
            if (fetchIntervalId) clearInterval(fetchIntervalId);
            fetchMTRData();
            fetchIntervalId = setInterval(fetchMTRData, 10000);
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                startIntervals();
            }
        });

        // 初始化執行
        fetchDailyMatthewGospel();
        fetchHKOWeather();
        startIntervals();

        // 每秒檢查動態時間刷新
        setInterval(tickFirstTrainCountdown, 1000);
        setInterval(fetchHKOWeather, 300000);
        setInterval(fetchDailyMatthewGospel, 300000);
    </script>
</body>
</html>
