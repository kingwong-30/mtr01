<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>康城站即時列車及資訊儀表板</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --highlight-color: #f59e0b;
            --mtr-purple: #8b5cf6;
            --inbound-color: #34d399;
            --error-color: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* 每日聖言卡片 */
        .scripture-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border-color: #4338ca;
        }

        .scripture-title {
            font-size: 0.8rem;
            color: #a5b4fc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scripture-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e0e7ff;
            font-weight: 400;
        }

        .scripture-ref {
            font-size: 0.8rem;
            color: #818cf8;
            margin-top: 8px;
            text-align: right;
            font-style: italic;
            font-weight: 600;
        }

        /* 天氣資訊卡片 */
        .weather-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .weather-icon {
            font-size: 2.2rem;
        }

        .temp-display {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .weather-details {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* 港鐵卡片 */
        .mtr-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mtr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .station-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .station-badge {
            background-color: var(--mtr-purple);
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .update-time {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-error {
            color: var(--error-color);
            font-weight: bold;
        }

        /* 方向分組標題 */
        .direction-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .direction-label.inbound {
            color: var(--inbound-color);
        }

        .train-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .train-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .train-dest {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .train-plat {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .train-time-wrap {
            text-align: right;
        }

        .exact-time {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 500;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; color: var(--error-color); }
            100% { opacity: 1; }
        }
        
        .arriving-text {
            animation: pulse 1.5s infinite;
            color: var(--error-color) !important;
            font-size: 1.3rem !important;
            font-weight: 800;
        }

        .train-item.first-train {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .train-item.first-train.inbound-bg {
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .first-train .train-time {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1;
        }

        .first-train.inbound-bg .train-time {
            color: var(--inbound-color);
        }

        .first-train .train-unit {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-left: 2px;
        }

        .first-train.inbound-bg .train-unit {
            color: var(--inbound-color);
        }

        .train-item.second-train {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .second-train .train-dest {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .second-train .train-time {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .second-train .train-unit {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .divider {
            height: 1px;
            background-color: var(--card-border);
            margin: 4px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 每日天主聖言 -->
        <div class="card scripture-card">
            <div class="scripture-title">
                <span>✝️ Daily Gospel</span>
                <span style="font-size:0.7rem; opacity:0.8;">Saint Matthew</span>
            </div>
            <div id="scripture" class="scripture-content">即時載入每日福音中...</div>
            <div id="scripture-ref" class="scripture-ref"></div>
        </div>

        <!-- 天氣資訊 -->
        <div class="card weather-card">
            <div class="weather-info">
                <div id="weather-icon" class="weather-icon">🌤️</div>
                <div id="temp" class="temp-display">--°C</div>
            </div>
            <div class="weather-details">
                <div>將軍澳天氣</div>
                <div>相對濕度: <span id="humidity">--%</span></div>
            </div>
        </div>

        <!-- 康城站列車資訊 -->
        <div class="card mtr-card">
            <div class="mtr-header">
                <div class="station-title">
                    康城站 <span class="station-badge">將軍澳綫</span>
                </div>
                <div class="update-time">
                    <span id="network-status"></span>
                    <span id="updated">最後更新 --:--</span>
                </div>
            </div>

            <!-- 往市區方向 (離站) -->
            <div class="train-section">
                <div class="direction-label">
                    <span>🚆 往 調景嶺 / 北角 方向</span>
                </div>
                <div class="train-list">
                    <div class="train-item first-train">
                        <div>
                            <div id="dest_down1" class="train-dest">載入中...</div>
                            <div id="plat_down1" class="train-plat">-- 月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_down1" class="train-time">--</span><span id="unit_down1" class="train-unit"></span>
                            <span id="exact_down1" class="exact-time"></span>
                        </div>
                    </div>
                    <div class="train-item second-train">
                        <div>
                            <div id="dest_down2" class="train-dest">載入中...</div>
                            <div id="plat_down2" class="train-plat">-- 月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_down2" class="train-time">--</span><span id="unit_down2" class="train-unit"></span>
                            <span id="exact_down2" class="exact-time"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <!-- 將軍澳綫往康城列車 (抵站推算) -->
            <div class="train-section">
                <div class="direction-label inbound">
                    <span>🏁 將軍澳綫往康城列車</span>
                </div>
                <div class="train-list">
                    <div class="train-item first-train inbound-bg">
                        <div>
                            <div id="dest_up1" class="train-dest">載入中...</div>
                            <div id="plat_up1" class="train-plat">-- 月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_up1" class="train-time">--</span><span id="unit_up1" class="train-unit"></span>
                            <span id="exact_up1" class="exact-time"></span>
                        </div>
                    </div>
                    <div class="train-item second-train">
                        <div>
                            <div id="dest_up2" class="train-dest">載入中...</div>
                            <div id="plat_up2" class="train-plat">-- 月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_up2" class="train-time">--</span><span id="unit_up2" class="train-unit"></span>
                            <span id="exact_up2" class="exact-time"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 快取 DOM 元素
        const dom = {};
        
        function cacheDOM() {
            const ids = [
                'scripture', 'scripture-ref', 'weather-icon', 'temp', 'humidity',
                'network-status', 'updated',
                'dest_down1', 'plat_down1', 'ttnt_down1', 'unit_down1', 'exact_down1',
                'dest_down2', 'plat_down2', 'ttnt_down2', 'unit_down2', 'exact_down2',
                'dest_up1', 'plat_up1', 'ttnt_up1', 'unit_up1', 'exact_up1',
                'dest_up2', 'plat_up2', 'ttnt_up2', 'unit_up2', 'exact_up2'
            ];
            ids.forEach(id => {
                dom[id] = document.getElementById(id);
            });
        }

        // 系統變數
        let firstDownTargetTime = null;
        let firstUpTargetTime = null;
        let isFirstDownArriving = false;
        let isFirstUpArriving = false;
        let timeOffset = 0; 
        
        // 簡化各站預計行車時間配置 (秒)
        const stationJourneySeconds = {
            'LHP': 0,      // 本站
            'TKO': 210,    // 將軍澳 3.5m
            'TIK': 390,    // 調景嶺 6.5m
            'YAT': 570,    // 油塘 9.5m
            'NOP': 930     // 北角 15.5m
        };

        const destNames = { 'NOP': '往 北角', 'TIK': '往 調景嶺', 'LHP': '往 康城', 'TKO': '往 將軍澳' };
        const matthewPassages = [ "1:21", "2:11", "3:17", "5:3-12", "6:9-13", "7:7-8", "11:28-30", "16:24", "28:18-20" ];

        // 工具函數：標準化解析港鐵時間字串 (相容 iOS Safari 及主流瀏覽器)
        function parseMTRTime(timeStr) {
            if (!timeStr) return null;
            // 將 "YYYY-MM-DD HH:mm:ss" 轉為 "YYYY-MM-DDTHH:mm:ss+08:00" ISO 8601 格式
            const isoStr = timeStr.trim().replace(' ', 'T') + '+08:00';
            const timestamp = new Date(isoStr).getTime();
            return isNaN(timestamp) ? null : timestamp;
        }

        function formatExactTime(ms) {
            if (!ms) return '';
            const d = new Date(ms);
            return `(${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')})`;
        }

        function getFormattedCurrentTime() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        // API：聖言
        async function fetchDailyMatthewGospel() {
            try {
                const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
                const passageRef = matthewPassages[dayOfYear % matthewPassages.length];
                const res = await fetch(`https://bible-api.com/matthew+${passageRef}?translation=web`);
                const data = await res.json();
                if (data && data.text) {
                    dom['scripture'].innerText = `"${data.text.replace(/\n/g, ' ').trim()}"`;
                    dom['scripture-ref'].innerText = `— ${data.reference} (Saint Matthew)`;
                }
            } catch (error) {
                dom['scripture'].innerText = '"Come to me, all you that are weary and are carrying heavy burdens..."';
                dom['scripture-ref'].innerText = '— Matthew 11:28';
            }
        }

        // API：天氣
        async function fetchHKOWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                if (data) {
                    const tkoTemp = data.temperature?.data.find(t => t.place.includes('將軍澳')) || data.temperature?.data[0];
                    if (tkoTemp) dom['temp'].innerText = `${tkoTemp.value}°C`;
                    if (data.humidity?.data?.[0]) dom['humidity'].innerText = `${data.humidity.data[0].value}%`;
                    
                    const iconMap = { 50:"☀️", 51:"⛅", 53:"🌤️", 60:"☁️", 62:"🌧️", 65:"⛈️", 70:"🌙" };
                    dom['weather-icon'].innerText = iconMap[data.icon?.[0]] || "🌤️";
                }
            } catch (error) { console.error('Weather Fetch Error'); }
        }

        // UI 升級：顯示倒數與實際時間、加入動畫狀態
        function updateCountdownUI(targetTime, isArriving, ttntId, unitId, exactId) {
            const elTtnt = dom[ttntId];
            const elUnit = dom[unitId];
            const elExact = dom[exactId];

            if (isArriving || (targetTime && (targetTime - (Date.now() + timeOffset) <= 0))) {
                elTtnt.innerText = '即將到站';
                elTtnt.className = 'train-time arriving-text';
                elUnit.innerText = '';
                elExact.innerText = '';
            } else if (targetTime) {
                const diffSec = Math.floor((targetTime - (Date.now() + timeOffset)) / 1000);
                const mins = Math.ceil(diffSec / 60);
                
                elTtnt.innerText = mins;
                elTtnt.className = 'train-time';
                elUnit.innerText = '分';
                elExact.innerText = formatExactTime(targetTime);
            } else {
                elTtnt.innerText = '--';
                elTtnt.className = 'train-time';
                elUnit.innerText = '';
                elExact.innerText = '';
            }
        }

        function tickFirstTrainCountdown() {
            updateCountdownUI(firstDownTargetTime, isFirstDownArriving, 'ttnt_down1', 'unit_down1', 'exact_down1');
            updateCountdownUI(firstUpTargetTime, isFirstUpArriving, 'ttnt_up1', 'unit_up1', 'exact_up1');
        }

        function setEmptyState(dir, index, msg) {
            dom[`dest_${dir}${index}`].innerText = msg;
            dom[`plat_${dir}${index}`].innerText = '-- 月台';
            dom[`ttnt_${dir}${index}`].innerText = '--';
            dom[`unit_${dir}${index}`].innerText = '';
            dom[`exact_${dir}${index}`].innerText = '';
            dom[`ttnt_${dir}${index}`].className = 'train-time';
        }

        // 主資料抓取與邏輯
        async function fetchMTRData() {
            const requestStartTime = Date.now();
            const stations = ['LHP', 'TKO', 'TIK', 'YAT', 'NOP'];
            
            try {
                // 平行抓取所有資料
                const responses = await Promise.all(
                    stations.map(sta => fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=${sta}`).then(r => r.json()).catch(() => null))
                );
                
                dom['network-status'].innerText = '';
                const rtt = Date.now() - requestStartTime;

                const resLHP = responses[0];
                const currTimeMs = resLHP?.curr_time ? parseMTRTime(resLHP.curr_time) : null;

                if (currTimeMs) {
                    timeOffset = (currTimeMs + (rtt / 2)) - Date.now();
                    dom['updated'].innerText = `最後更新 ${resLHP.curr_time.split(' ')[1].substring(0,5)}`;
                } else {
                    dom['updated'].innerText = `最後更新 ${getFormattedCurrentTime()}`;
                }

                // --- 1. 處理往市區方向 (DOWN) ---
                const mtrLHPData = resLHP?.data?.['TKL-LHP'];
                if (resLHP?.status === 1 && mtrLHPData?.DOWN && mtrLHPData.DOWN.length > 0) {
                    const downTrains = mtrLHPData.DOWN;

                    // 車次 1
                    dom['dest_down1'].innerText = destNames[downTrains[0].dest] || `往 ${downTrains[0].dest}`;
                    dom['plat_down1'].innerText = `${downTrains[0].plat} 月台`;
                    if (downTrains[0].ttnt === '0' || !downTrains[0].time) {
                        isFirstDownArriving = true;
                        firstDownTargetTime = null;
                    } else {
                        isFirstDownArriving = false;
                        firstDownTargetTime = parseMTRTime(downTrains[0].time);
                    }

                    // 車次 2
                    if (downTrains.length > 1) {
                        dom['dest_down2'].innerText = destNames[downTrains[1].dest] || `往 ${downTrains[1].dest}`;
                        dom['plat_down2'].innerText = `${downTrains[1].plat} 月台`;
                        const t2Time = parseMTRTime(downTrains[1].time);
                        updateCountdownUI(t2Time, downTrains[1].ttnt === '0', 'ttnt_down2', 'unit_down2', 'exact_down2');
                    } else {
                        setEmptyState('down', 2, '暫無下班車');
                    }
                } else {
                    setEmptyState('down', 1, '非服務時間');
                    setEmptyState('down', 2, '非服務時間');
                    isFirstDownArriving = false;
                    firstDownTargetTime = null;
                }

                // --- 2. 處理抵站方向 (UP - 跨站推算) ---
                let rawUpCandidates = [];
                const nowMs = Date.now() + timeOffset;

                stations.forEach((sta, idx) => {
                    const res = responses[idx];
                    const staData = res?.data?.[`TKL-${sta}`]?.UP;
                    
                    if (staData) {
                        staData.forEach(t => {
                            if (sta === 'LHP' || t.dest === 'LHP') {
                                if (t.time) {
                                    const baseTime = parseMTRTime(t.time);
                                    if (baseTime) {
                                        rawUpCandidates.push({
                                            plat: sta === 'LHP' ? (t.plat || '1') : '1',
                                            targetTime: baseTime + (stationJourneySeconds[sta] * 1000),
                                            isArriving: (sta === 'LHP' && t.ttnt === '0')
                                        });
                                    }
                                } else if (sta === 'LHP' && t.ttnt === '0') {
                                    rawUpCandidates.push({ plat: t.plat || '1', targetTime: nowMs, isArriving: true });
                                }
                            }
                        });
                    }
                });

                // 過濾過去的時間並排序去重 (相差少於 90 秒視為同一班車)
                rawUpCandidates = rawUpCandidates.filter(c => c.targetTime >= nowMs - 30000).sort((a, b) => a.targetTime - b.targetTime);
                const upTrains = [];
                rawUpCandidates.forEach(candidate => {
                    if (!upTrains.some(existing => Math.abs(existing.targetTime - candidate.targetTime) < 90000)) {
                        upTrains.push(candidate);
                    }
                });

                if (upTrains.length > 0) {
                    // 車次 1
                    dom['dest_up1'].innerText = '往 康城';
                    dom['plat_up1'].innerText = `${upTrains[0].plat} 月台`;
                    isFirstUpArriving = upTrains[0].isArriving;
                    firstUpTargetTime = upTrains[0].targetTime;

                    // 車次 2
                    if (upTrains.length > 1) {
                        dom['dest_up2'].innerText = '往 康城';
                        dom['plat_up2'].innerText = `${upTrains[1].plat} 月台`;
                        updateCountdownUI(upTrains[1].targetTime, upTrains[1].isArriving, 'ttnt_up2', 'unit_up2', 'exact_up2');
                    } else {
                        setEmptyState('up', 2, '暫無下班車');
                    }
                } else {
                    setEmptyState('up', 1, '暫無抵站列車');
                    setEmptyState('up', 2, '暫無下班車');
                    isFirstUpArriving = false;
                    firstUpTargetTime = null;
                }
                
                // 強制更新 UI
                tickFirstTrainCountdown();

            } catch (error) {
                console.error('MTR Fetch Error:', error);
                dom['network-status'].innerText = '⚠️ 連線異常 | ';
                dom['network-status'].className = 'status-error';
            }
        }

        // 初始化
        function initDashboard() {
            cacheDOM();
            fetchDailyMatthewGospel();
            fetchHKOWeather();
            fetchMTRData();

            // 每 1 秒刷新本機前端倒數
            setInterval(tickFirstTrainCountdown, 1000);

            // 每 25 秒重新抓取資料，避免 API rate limit
            setInterval(fetchMTRData, 25000);

            // 每 10 分鐘更新天氣
            setInterval(fetchHKOWeather, 600000);
        }

        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
