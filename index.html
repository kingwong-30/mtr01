<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA / Web App 全螢幕設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <title>康城站列車時間</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "PingFang HK", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 10px 24px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden; /* 避免出現滾動條 */
        }
        .header {
            text-align: center;
            border-bottom: 3px solid #000000;
            padding-bottom: 10px;
            margin-top: 5px;
        }
        .station-title {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .train-list {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }
        .train-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }
        .train-row:not(:last-child) {
            border-bottom: 2px dashed #000000;
        }
        .train-info {
            text-align: left;
        }
        .destination {
            font-weight: 900;
            line-height: 1.2;
        }
        .platform {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 6px;
        }
        .time-box {
            text-align: right;
            white-space: nowrap;
        }
        .time-val {
            font-weight: 900;
            line-height: 1;
        }
        
        /* 第一班車：加大字體填充畫面 */
        .first-train .destination {
            font-size: 2.2rem;
        }
        .first-train .time-val {
            font-size: 4.8rem;
        }

        /* 第二班車：次要大小 */
        .second-train .destination {
            font-size: 1.6rem;
        }
        .second-train .time-val {
            font-size: 3rem;
        }

        .time-unit {
            font-size: 1.2rem;
            font-weight: 800;
            margin-left: 2px;
        }
        .status {
            font-size: 0.9rem;
            font-weight: 700;
            text-align: center;
            border-top: 2px solid #000000;
            padding-top: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="station-title">康城 LOHAS PARK</div>
    </div>

    <div class="train-list">
        <!-- 第一班車 -->
        <div class="train-row first-train">
            <div class="train-info">
                <div id="dest1" class="destination">載入中...</div>
                <div id="plat1" class="platform">-- 號月台</div>
            </div>
            <div class="time-box">
                <span id="ttnt1" class="time-val">--</span><span id="unit1" class="time-unit">分</span>
            </div>
        </div>

        <!-- 第二班車 -->
        <div class="train-row second-train">
            <div class="train-info">
                <div id="dest2" class="destination">--</div>
                <div id="plat2" class="platform">-- 號月台</div>
            </div>
            <div class="time-box">
                <span id="ttnt2" class="time-val">--</span><span id="unit2" class="time-unit">分</span>
            </div>
        </div>
    </div>

    <div id="updated" class="status">更新中...</div>

<script>
    const destNames = {
        'NOP': '往 北角',
        'TIK': '往 調景嶺',
        'LHP': '康城',
        'TKO': '將軍澳'
    };

    async function fetchMTRData() {
        try {
            const response = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP');
            const data = await response.json();

            if (data.status === 1 && data.data['TKL-LHP'] && data.data['TKL-LHP'].DOWN) {
                const trains = data.data['TKL-LHP'].DOWN;

                if (trains.length > 0) {
                    updateTrainSlot(trains[0], 1);
                } else {
                    document.getElementById('dest1').innerText = '暫無班次';
                }

                if (trains.length > 1) {
                    updateTrainSlot(trains[1], 2);
                } else {
                    document.getElementById('dest2').innerText = '暫無下班車';
                    document.getElementById('plat2').innerText = '';
                    document.getElementById('ttnt2').innerText = '--';
                    document.getElementById('unit2').innerText = '';
                }

                // 直接讀取港鐵官方回傳的香港時間 (curr_time: "YYYY-MM-DD HH:MM:SS")，解決 Kindle 時區偏離問題
                if (data.curr_time) {
                    const timeOnly = data.curr_time.split(' ')[1];
                    document.getElementById('updated').innerText = `最後更新 ${timeOnly}`;
                } else {
                    const now = new Date();
                    const hkDate = new Date(now.getTime() + (8 * 60 * 60 * 1000));
                    const hh = hkDate.getUTCHours().toString().padStart(2, '0');
                    const mm = hkDate.getUTCMinutes().toString().padStart(2, '0');
                    const ss = hkDate.getUTCSeconds().toString().padStart(2, '0');
                    document.getElementById('updated').innerText = `最後更新 ${hh}:${mm}:${ss}`;
                }
            } else {
                document.getElementById('dest1').innerText = '暫無資料';
            }
        } catch (error) {
            document.getElementById('dest1').innerText = '連線失敗';
        }
    }

    function updateTrainSlot(train, slotNum) {
        const destCode = train.dest;
        const minutes = train.ttnt;
        const platform = train.plat;

        document.getElementById(`dest${slotNum}`).innerText = destNames[destCode] || `往 ${destCode}`;
        document.getElementById(`plat${slotNum}`).innerText = `${platform} 號月台`;

        if (minutes === '0') {
            document.getElementById(`ttnt${slotNum}`).innerText = '即將到站';
            document.getElementById(`unit${slotNum}`).innerText = '';
        } else {
            document.getElementById(`ttnt${slotNum}`).innerText = minutes;
            document.getElementById(`unit${slotNum}`).innerText = '分';
        }
    }

    fetchMTRData();
    setInterval(fetchMTRData, 30000); // 每 30 秒自動更新
</script>

</body>
</html>
