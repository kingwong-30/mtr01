<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>康城站即時列車及資訊儀表板</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --highlight-color: #f59e0b;
            --mtr-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* 每日聖言卡片 */
        .scripture-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border-color: #4338ca;
        }

        .scripture-title {
            font-size: 0.8rem;
            color: #a5b4fc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .scripture-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e0e7ff;
            font-weight: 400;
        }

        /* 天氣資訊卡片 */
        .weather-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .weather-icon {
            font-size: 2.2rem;
        }

        .temp-display {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .weather-details {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* 港鐵卡片 */
        .mtr-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mtr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .station-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .station-badge {
            background-color: var(--mtr-purple);
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .update-time {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* 列車班次列表 */
        .train-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 第一班車 */
        .train-item.first-train {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .train-dest {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .train-plat {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .train-time-wrap {
            text-align: right;
        }

        .first-train .train-time {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1;
        }

        .first-train .train-unit {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-left: 2px;
        }

        /* 第二班車 */
        .train-item.second-train {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .second-train .train-dest {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .second-train .train-time {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .second-train .train-unit {
            font-size: 0.85rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 每日天主聖言 -->
        <div class="card scripture-card">
            <div class="scripture-title">✝️ Daily Scripture</div>
            <div id="scripture" class="scripture-content">Loading...</div>
        </div>

        <!-- 天氣資訊 -->
        <div class="card weather-card">
            <div class="weather-info">
                <div id="weather-icon" class="weather-icon">🌤️</div>
                <div id="temp" class="temp-display">--°C</div>
            </div>
            <div class="weather-details">
                <div>將軍澳天氣</div>
                <div>相對濕度: <span id="humidity">--%</span></div>
            </div>
        </div>

        <!-- 康城站列車資訊 -->
        <div class="card mtr-card">
            <div class="mtr-header">
                <div class="station-title">
                    康城站 <span class="station-badge">將軍澳綫</span>
                </div>
                <div id="updated" class="update-time">最後更新時間 --:--:--</div>
            </div>

            <div class="train-list">
                <!-- 第一班車 -->
                <div class="train-item first-train">
                    <div>
                        <div id="dest1" class="train-dest">載入中...</div>
                        <div id="plat1" class="train-plat">-- 號月台</div>
                    </div>
                    <div class="train-time-wrap">
                        <span id="ttnt1" class="train-time">--</span>
                        <span id="unit1" class="train-unit"></span>
                    </div>
                </div>

                <!-- 第二班車 -->
                <div class="train-item second-train">
                    <div>
                        <div id="dest2" class="train-dest">載入中...</div>
                        <div id="plat2" class="train-plat">-- 號月台</div>
                    </div>
                    <div class="train-time-wrap">
                        <span id="ttnt2" class="train-time">--</span>
                        <span id="unit2" class="train-unit"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局倒數控制變數
        let firstTrainTargetTime = null;
        let timeOffset = 0; // 校正裝置與港鐵伺服器時間差
        let isFirstTrainArriving = false;
        let fetchIntervalId = null; // 用來管理 10 秒刷新的計時器

        // 英文原版天主教 31 句聖言（NRSVCE / RSVCE 譯本）
        const catholicScriptures = [
            "Come to me, all you that are weary and are carrying heavy burdens, and I will give you rest. (Matthew 11:28)",
            "Peace I leave with you; my peace I give to you. I do not give to you as the world gives. (John 14:27)",
            "The Lord is my shepherd, I shall not want. (Psalm 23:1)",
            "Love is patient; love is kind; love is not envious or boastful or arrogant or rude. (1 Corinthians 13:4)",
            "Rejoice always, pray without ceasing, give thanks in all circumstances. (1 Thessalonians 5:16-18)",
            "The Lord is my light and my salvation; whom shall I fear? (Psalm 27:1)",
            "Your word is a lamp to my feet and a light to my path. (Psalm 119:105)",
            "Ask, and it will be given you; search, and you will find; knock, and the door will be opened for you. (Matthew 7:7)",
            "And remember, I am with you always, to the end of the age. (Matthew 28:20)",
            "The Lord is near to the brokenhearted, and saves the crushed in spirit. (Psalm 34:18)",
            "Trust in the Lord with all your heart, and do not rely on your own insight. (Proverbs 3:5)",
            "Blessed are the pure in heart, for they will see God. (Matthew 5:8)",
            "This is my commandment, that you love one another as I have loved you. (John 15:12)",
            "God is our refuge and strength, a very present help in trouble. (Psalm 46:1)",
            "For God so loved the world that he gave his only Son, so that everyone who believes in him may not perish. (John 3:16)",
            "The Lord bless you and keep you; the Lord make his face to shine upon you, and give you peace. (Numbers 6:24-26)",
            "Be kind to one another, tenderhearted, forgiving one another, as God in Christ has forgiven you. (Ephesians 4:32)",
            "The Lord is my rock, my fortress, and my deliverer, my God, my rock in whom I take refuge. (Psalm 18:2)",
            "Take delight in the Lord, and he will give you the desires of your heart. (Psalm 37:4)",
            "God opposes the proud, but gives grace to the humble. (1 Peter 5:5)",
            "See, the Lord's hand is not too short to save, nor his ear too dull to hear. (Isaiah 59:1)",
            "May the God of hope fill you with all joy and peace in believing, so that you may abound in hope. (Romans 15:13)",
            "We know that all things work together for good for those who love God. (Romans 8:28)",
            "Be strong and courageous; do not be frightened or dismayed, for the Lord your God is with you wherever you go. (Joshua 1:9)",
            "The Spirit of the Lord is upon me, because he has anointed me to bring good news to the poor. (Luke 4:18)",
            "Whatever your task, put your whole heart into it, as done for the Lord and not for your masters. (Colossians 3:23)",
            "The fear of the Lord is the beginning of wisdom; all those who practice it have a good understanding. (Psalm 111:10)",
            "The Lord is my strength and my shield; in him my heart trusts, and I am helped. (Psalm 28:7)",
            "Listen! I am standing at the door, knocking; if you hear my voice and open the door, I will come in to you. (Revelation 3:20)",
            "Rejoice in the Lord always; again I will say, Rejoice. (Philippians 4:4)",
            "The Lord will keep your going out and your coming in from this time on and forevermore. (Psalm 121:8)"
        ];

        // 天氣圖示對應邏輯
        function getHKOEmoji(iconCode) {
            const iconMap = {
                50: "☀️", 51: "⛅", 52: "⛅", 53: "🌤️", 54: "⛅",
                60: "☁️", 61: "☁️", 62: "🌧️", 63: "🌧️", 64: "🌧️",
                65: "⛈️", 70: "🌙", 71: "🌙", 72: "🌙", 73: "🌙",
                74: "🌙", 75: "🌙", 76: "🌤️", 77: "⛈️", 80: "💨",
                81: "🌵", 82: "💧", 83: "🌫️", 84: "🌫️", 85: "🌫️"
            };
            return iconMap[iconCode] || "🌤️";
        }

        // 載入當天金句 (依日期自動切換 1-31)
        function loadTodayCatholicVerse() {
            const today = new Date().getDate();
            const verseIndex = (today - 1) % catholicScriptures.length;
            const verseText = catholicScriptures[verseIndex];
            const elem = document.getElementById('scripture');
            if (elem) elem.innerText = verseText;
        }

        // 抓取香港天文台即時天氣
        async function fetchHKOWeather() {
            try {
                const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await response.json();
                
                if (data) {
                    if (data.temperature && data.temperature.data) {
                        const tkoTemp = data.temperature.data.find(t => t.place.includes('將軍澳')) || data.temperature.data[0];
                        const tempElem = document.getElementById('temp');
                        if (tempElem) tempElem.innerText = `${tkoTemp.value}°C`;
                    }
                    
                    if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
                        const humElem = document.getElementById('humidity');
                        if (humElem) humElem.innerText = `${data.humidity.data[0].value}%`;
                    }

                    if (data.icon && data.icon.length > 0) {
                        const iconCode = data.icon[0];
                        const emoji = getHKOEmoji(iconCode);
                        const iconElem = document.getElementById('weather-icon');
                        if (iconElem) iconElem.innerText = emoji;
                    }
                }
            } catch (error) {
                console.error('HKO Weather Fetch Error:', error);
            }
        }

        const destNames = {
            'NOP': '往 北角',
            'TIK': '往 調景嶺',
            'LHP': '康城',
            'TKO': '將軍澳'
        };

        function tickFirstTrainCountdown() {
            if (isFirstTrainArriving || !firstTrainTargetTime) return;

            // 計算現在時間，已經包含咗伺服器時間差同網絡延遲補償
            const now = Date.now() + timeOffset;
            const diffSec = Math.floor((firstTrainTargetTime - now) / 1000);

            if (diffSec <= 0) {
                document.getElementById('ttnt1').innerText = '即將到站';
                document.getElementById('unit1').innerText = '';
                isFirstTrainArriving = true;
            } else if (diffSec <= 120) {
                const mins = Math.floor(diffSec / 60);
                const secs = diffSec % 60;
                const formattedSecs = secs < 10 ? `0${secs}` : secs;
                document.getElementById('ttnt1').innerText = `${mins}:${formattedSecs}`;
                document.getElementById('unit1').innerText = '';
            } else {
                const mins = Math.ceil(diffSec / 60);
                document.getElementById('ttnt1').innerText = mins;
                document.getElementById('unit1').innerText = '分';
            }
        }

        async function fetchMTRData() {
            try {
                // 紀錄開始 Fetch 嘅時間
                const requestStartTime = Date.now();
                
                const response = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP');
                const data = await response.json();
                
                // 紀錄收到數據嘅時間，計算網絡延遲 (RTT)
                const requestEndTime = Date.now();
                const rtt = requestEndTime - requestStartTime;

                if (data.curr_time) {
                    // 強制加上香港時區 +0800
                    const serverTimeStr = data.curr_time.replace(/-/g, '/') + ' +0800';
                    const serverMs = new Date(serverTimeStr).getTime();
                    
                    // 【終極精準補償】：伺服器時間 + (網絡延遲 / 2) - 裝置當前時間
                    timeOffset = (serverMs + (rtt / 2)) - Date.now();
                    
                    const timeOnly = data.curr_time.split(' ')[1];
                    document.getElementById('updated').innerText = `最後更新時間 ${timeOnly}`;
                }

                if (data.status === 1 && data.data['TKL-LHP'] && data.data['TKL-LHP'].DOWN) {
                    const trains = data.data['TKL-LHP'].DOWN;

                    if (trains.length > 0) {
                        const firstTrain = trains[0];
                        document.getElementById('dest1').innerText = destNames[firstTrain.dest] || `往 ${firstTrain.dest}`;
                        document.getElementById('plat1').innerText = `${firstTrain.plat} 號月台`;

                        if (firstTrain.ttnt === '0' || firstTrain.ttnt === '') {
                            firstTrainTargetTime = null;
                            isFirstTrainArriving = true;
                            document.getElementById('ttnt1').innerText = '即將到站';
                            document.getElementById('unit1').innerText = '';
                        } else if (firstTrain.time) {
                            isFirstTrainArriving = false;
                            const targetTimeStr = firstTrain.time.replace(/-/g, '/') + ' +0800';
                            firstTrainTargetTime = new Date(targetTimeStr).getTime();
                            tickFirstTrainCountdown(); 
                        }
                    } else {
                        firstTrainTargetTime = null;
                        isFirstTrainArriving = false;
                        document.getElementById('dest1').innerText = '暫無班次';
                        document.getElementById('ttnt1').innerText = '--';
                        document.getElementById('unit1').innerText = '';
                    }

                    if (trains.length > 1) {
                        const secondTrain = trains[1];
                        document.getElementById('dest2').innerText = destNames[secondTrain.dest] || `往 ${secondTrain.dest}`;
                        document.getElementById('plat2').innerText = `${secondTrain.plat} 號月台`;
                        
                        if (secondTrain.ttnt === '0') {
                            document.getElementById('ttnt2').innerText = '即將到站';
                            document.getElementById('unit2').innerText = '';
                        } else {
                            document.getElementById('ttnt2').innerText = secondTrain.ttnt;
                            document.getElementById('unit2').innerText = '分';
                        }
                    } else {
                        document.getElementById('dest2').innerText = '暫無下班車';
                        document.getElementById('plat2').innerText = '';
                        document.getElementById('ttnt2').innerText = '--';
                        document.getElementById('unit2').innerText = '';
                    }
                } else {
                    document.getElementById('dest1').innerText = '暫無列車資料';
                    firstTrainTargetTime = null;
                }
            } catch (error) {
                console.error(error);
                // 不顯示連線失敗蓋過畫面，只在背景重試，保持使用者體驗流暢
            }
        }

        // 啟動與重置計時器的封裝函數
        function startIntervals() {
            if (fetchIntervalId) clearInterval(fetchIntervalId);
            fetchMTRData(); // 立即攞一次
            fetchIntervalId = setInterval(fetchMTRData, 10000); // 之後每 10 秒攞一次
        }

        // 監聽網頁可見度 (解決鎖屏/轉App導致的時間停頓)
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                // 一轉返入網頁，立即重新計時並刷新數據，畫面唔會卡住喺舊時間
                startIntervals();
            }
        });

        // 初始化執行
        loadTodayCatholicVerse();
        fetchHKOWeather();
        startIntervals(); // 呼叫港鐵 API

        // 每秒本地倒數 (唔會受伺服器限制，維持 UI 流暢度)
        setInterval(tickFirstTrainCountdown, 1000);
        // 天氣可以維持 5 分鐘刷新
        setInterval(fetchHKOWeather, 300000);
    </script>
</body>
</html>
