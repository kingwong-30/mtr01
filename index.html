<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>康城站即時列車及資訊儀表板</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --highlight-color: #f59e0b;
            --mtr-purple: #8b5cf6;
            --inbound-color: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* 每日聖言卡片 */
        .scripture-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border-color: #4338ca;
        }

        .scripture-title {
            font-size: 0.8rem;
            color: #a5b4fc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .scripture-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e0e7ff;
            font-weight: 400;
        }

        /* 天氣資訊卡片 */
        .weather-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .weather-icon {
            font-size: 2.2rem;
        }

        .temp-display {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .weather-details {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* 港鐵卡片 */
        .mtr-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mtr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .station-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .station-badge {
            background-color: var(--mtr-purple);
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .update-time {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* 方向分組標題 */
        .direction-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .direction-label.inbound {
            color: var(--inbound-color);
        }

        .train-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .train-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 第一班車 */
        .train-item.first-train {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .train-item.first-train.inbound-bg {
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .train-dest {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .train-plat {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .train-time-wrap {
            text-align: right;
        }

        .first-train .train-time {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1;
        }

        .first-train.inbound-bg .train-time {
            color: var(--inbound-color);
        }

        .first-train .train-unit {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-left: 2px;
        }

        .first-train.inbound-bg .train-unit {
            color: var(--inbound-color);
        }

        /* 第二班車 */
        .train-item.second-train {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .second-train .train-dest {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0;
        }

        .second-train .train-time {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .second-train .train-unit {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .divider {
            height: 1px;
            background-color: var(--card-border);
            margin: 4px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 每日天主聖言 (聖瑪竇福音 英文) -->
        <div class="card scripture-card">
            <div class="scripture-title">✝️ Daily Gospel (Gospel of Saint Matthew)</div>
            <div id="scripture" class="scripture-content">Loading...</div>
        </div>

        <!-- 天氣資訊 -->
        <div class="card weather-card">
            <div class="weather-info">
                <div id="weather-icon" class="weather-icon">🌤️</div>
                <div id="temp" class="temp-display">--°C</div>
            </div>
            <div class="weather-details">
                <div>將軍澳天氣</div>
                <div>相對濕度: <span id="humidity">--%</span></div>
            </div>
        </div>

        <!-- 康城站列車資訊 -->
        <div class="card mtr-card">
            <div class="mtr-header">
                <div class="station-title">
                    康城站 <span class="station-badge">將軍澳綫</span>
                </div>
                <div id="updated" class="update-time">最後更新時間 --:--:--</div>
            </div>

            <!-- 往市區方向 (離站) -->
            <div class="train-section">
                <div class="direction-label">
                    <span>🚆 往 調景嶺 / 北角 方向</span>
                </div>
                <div class="train-list">
                    <div class="train-item first-train">
                        <div>
                            <div id="dest_down1" class="train-dest">載入中...</div>
                            <div id="plat_down1" class="train-plat">-- 號月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_down1" class="train-time">--</span>
                            <span id="unit_down1" class="train-unit"></span>
                        </div>
                    </div>
                    <div class="train-item second-train">
                        <div>
                            <div id="dest_down2" class="train-dest">載入中...</div>
                            <div id="plat_down2" class="train-plat">-- 號月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_down2" class="train-time">--</span>
                            <span id="unit_down2" class="train-unit"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <!-- 往康城方向 (抵站) -->
            <div class="train-section">
                <div class="direction-label inbound">
                    <span>🏁 往 康城站 列車 (抵站)</span>
                </div>
                <div class="train-list">
                    <div class="train-item first-train inbound-bg">
                        <div>
                            <div id="dest_up1" class="train-dest">載入中...</div>
                            <div id="plat_up1" class="train-plat">-- 號月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_up1" class="train-time">--</span>
                            <span id="unit_up1" class="train-unit"></span>
                        </div>
                    </div>
                    <div class="train-item second-train">
                        <div>
                            <div id="dest_up2" class="train-dest">載入中...</div>
                            <div id="plat_up2" class="train-plat">-- 號月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_up2" class="train-time">--</span>
                            <span id="unit_up2" class="train-unit"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局倒數控制變數
        let firstDownTargetTime = null;
        let firstUpTargetTime = null;
        let isFirstDownArriving = false;
        let isFirstUpArriving = false;
        let timeOffset = 0; // 校正裝置與港鐵伺服器時間差
        let fetchIntervalId = null; // 用來管理 10 秒刷新的計時器

        // 31 句全數出自《聖瑪竇福音》的英文金句 (Gospel of Saint Matthew)
        const catholicScriptures = [
            "She will bear a son, and you are to name him Jesus, for he will save his people from their sins. (Matthew 1:21)",
            "On entering the house, they saw the child with Mary his mother; and they knelt down and paid him homage. (Matthew 2:11)",
            "And a voice from heaven said, 'This is my Son, the Beloved, with whom I am well pleased.' (Matthew 3:17)",
            "Jesus said to him, 'Again it is written, Do not put the Lord your God to the test.' (Matthew 4:7)",
            "Blessed are the poor in spirit, for theirs is the kingdom of heaven. (Matthew 5:3)",
            "Blessed are the meek, for they will inherit the earth. (Matthew 5:5)",
            "Blessed are the peacemakers, for they will be called children of God. (Matthew 5:9)",
            "You are the light of the world. A city built on a hill cannot be hid. (Matthew 5:14)",
            "Let your light shine before others, so that they may see your good works and give glory to your Father in heaven. (Matthew 5:16)",
            "Pray then in this way: Our Father in heaven, hallowed be your name. (Matthew 6:9)",
            "But strive first for the kingdom of God and his righteousness, and all these things will be given to you as well. (Matthew 6:33)",
            "So do not worry about tomorrow, for tomorrow will bring its own worries. Today's trouble is enough for today. (Matthew 6:34)",
            "Ask, and it will be given you; search, and you will find; knock, and the door will be opened for you. (Matthew 7:7)",
            "In everything do to others as you would have them do to you; for this is the law and the prophets. (Matthew 7:12)",
            "Everyone then who hears these words of mine and acts on them will be like a wise man who built his house on rock. (Matthew 7:24)",
            "When Jesus heard this, he was amazed and said, 'Truly I tell you, in no one in Israel have I found such faith.' (Matthew 8:10)",
            "Go and learn what this means, 'I desire mercy, not sacrifice.' For I have come to call not the righteous, but sinners. (Matthew 9:13)",
            "Then he said to his disciples, 'The harvest is plentiful, but the laborers are few.' (Matthew 9:37)",
            "So do not be afraid; you are of more value than many sparrows. (Matthew 10:31)",
            "Come to me, all you that are weary and are carrying heavy burdens, and I will give you rest. (Matthew 11:28)",
            "Take my yoke upon you, and learn from me; for I am gentle and humble in heart, and you will find rest for your souls. (Matthew 11:29)",
            "For where two or three are gathered in my name, I am there among them. (Matthew 18:20)",
            "Jesus said, 'Let the little children come to me, and do not stop them; for it is to such as these that the kingdom of heaven belongs.' (Matthew 19:14)",
            "For many are called, but few are chosen. (Matthew 22:14)",
            "You shall love the Lord your God with all your heart, and with all your soul, and with all your mind. (Matthew 22:37)",
            "You shall love your neighbor as yourself. (Matthew 22:39)",
            "Truly I tell you, just as you did it to one of the least of these who are members of my family, you did it to me. (Matthew 25:40)",
            "And while they were eating, Jesus took bread, and blessed and broke it, and gave it to the disciples and said, 'Take, eat; this is my body.' (Matthew 26:26)",
            "Watch and pray that you may not enter into temptation; the spirit indeed is willing, but the flesh is weak. (Matthew 26:41)",
            "And Jesus came and said to them, 'All authority in heaven and on earth has been given to me.' (Matthew 28:18)",
            "And remember, I am with you always, to the end of the age. (Matthew 28:20)"
        ];

        // 天氣圖示對應邏輯
        function getHKOEmoji(iconCode) {
            const iconMap = {
                50: "☀️", 51: "⛅", 52: "⛅", 53: "🌤️", 54: "⛅",
                60: "☁️", 61: "☁️", 62: "🌧️", 63: "🌧️", 64: "🌧️",
                65: "⛈️", 70: "🌙", 71: "🌙", 72: "🌙", 73: "🌙",
                74: "🌙", 75: "🌙", 76: "🌤️", 77: "⛈️", 80: "💨",
                81: "🌵", 82: "💧", 83: "🌫️", 84: "🌫️", 85: "🌫️"
            };
            return iconMap[iconCode] || "🌤️";
        }

        // 載入當天聖瑪竇福音金句 (依日期自動切換 1-31)
        function loadTodayCatholicVerse() {
            const today = new Date().getDate();
            const verseIndex = (today - 1) % catholicScriptures.length;
            const verseText = catholicScriptures[verseIndex];
            const elem = document.getElementById('scripture');
            if (elem) elem.innerText = verseText;
        }

        // 抓取香港天文台即時天氣
        async function fetchHKOWeather() {
            try {
                const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await response.json();
                
                if (data) {
                    if (data.temperature && data.temperature.data) {
                        const tkoTemp = data.temperature.data.find(t => t.place.includes('將軍澳')) || data.temperature.data[0];
                        const tempElem = document.getElementById('temp');
                        if (tempElem) tempElem.innerText = `${tkoTemp.value}°C`;
                    }
                    
                    if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
                        const humElem = document.getElementById('humidity');
                        if (humElem) humElem.innerText = `${data.humidity.data[0].value}%`;
                    }

                    if (data.icon && data.icon.length > 0) {
                        const iconCode = data.icon[0];
                        const emoji = getHKOEmoji(iconCode);
                        const iconElem = document.getElementById('weather-icon');
                        if (iconElem) iconElem.innerText = emoji;
                    }
                }
            } catch (error) {
                console.error('HKO Weather Fetch Error:', error);
            }
        }

        const destNames = {
            'NOP': '往 北角',
            'TIK': '往 調景嶺',
            'LHP': '康城',
            'TKO': '將軍澳'
        };

        // 通用倒數顯示邏輯
        function updateCountdownUI(targetTime, isArriving, ttntElemId, unitElemId) {
            if (isArriving) {
                document.getElementById(ttntElemId).innerText = '即將到站';
                document.getElementById(unitElemId).innerText = '';
                return;
            }
            if (!targetTime) return;

            const now = Date.now() + timeOffset;
            const diffSec = Math.floor((targetTime - now) / 1000);

            if (diffSec <= 0) {
                document.getElementById(ttntElemId).innerText = '即將到站';
                document.getElementById(unitElemId).innerText = '';
            } else if (diffSec <= 120) {
                const mins = Math.floor(diffSec / 60);
                const secs = diffSec % 60;
                const formattedSecs = secs < 10 ? `0${secs}` : secs;
                document.getElementById(ttntElemId).innerText = `${mins}:${formattedSecs}`;
                document.getElementById(unitElemId).innerText = '';
            } else {
                const mins = Math.ceil(diffSec / 60);
                document.getElementById(ttntElemId).innerText = mins;
                document.getElementById(unitElemId).innerText = '分';
            }
        }

        function tickFirstTrainCountdown() {
            if (firstDownTargetTime && !isFirstDownArriving) {
                updateCountdownUI(firstDownTargetTime, isFirstDownArriving, 'ttnt_down1', 'unit_down1');
            }
            if (firstUpTargetTime && !isFirstUpArriving) {
                updateCountdownUI(firstUpTargetTime, isFirstUpArriving, 'ttnt_up1', 'unit_up1');
            }
        }

        async function fetchMTRData() {
            try {
                const requestStartTime = Date.now();
                
                const response = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP');
                const data = await response.json();
                
                const requestEndTime = Date.now();
                const rtt = requestEndTime - requestStartTime;

                if (data.curr_time) {
                    const serverTimeStr = data.curr_time.replace(/-/g, '/') + ' +0800';
                    const serverMs = new Date(serverTimeStr).getTime();
                    
                    timeOffset = (serverMs + (rtt / 2)) - Date.now();
                    
                    const timeOnly = data.curr_time.split(' ')[1];
                    document.getElementById('updated').innerText = `最後更新時間 ${timeOnly}`;
                }

                if (data.status === 1 && data.data['TKL-LHP']) {
                    const mtrData = data.data['TKL-LHP'];

                    // --- 1. 處理往市區方向列車 (DOWN) ---
                    if (mtrData.DOWN && mtrData.DOWN.length > 0) {
                        const downTrains = mtrData.DOWN;

                        // 第一班車
                        const firstDown = downTrains[0];
                        document.getElementById('dest_down1').innerText = destNames[firstDown.dest] || `往 ${firstDown.dest}`;
                        document.getElementById('plat_down1').innerText = `${firstDown.plat} 號月台`;

                        if (firstDown.ttnt === '0' || firstDown.ttnt === '') {
                            firstDownTargetTime = null;
                            isFirstDownArriving = true;
                            document.getElementById('ttnt_down1').innerText = '即將到站';
                            document.getElementById('unit_down1').innerText = '';
                        } else if (firstDown.time) {
                            isFirstDownArriving = false;
                            const targetTimeStr = firstDown.time.replace(/-/g, '/') + ' +0800';
                            firstDownTargetTime = new Date(targetTimeStr).getTime();
                            updateCountdownUI(firstDownTargetTime, false, 'ttnt_down1', 'unit_down1');
                        }

                        // 第二班車
                        if (downTrains.length > 1) {
                            const secondDown = downTrains[1];
                            document.getElementById('dest_down2').innerText = destNames[secondDown.dest] || `往 ${secondDown.dest}`;
                            document.getElementById('plat_down2').innerText = `${secondDown.plat} 號月台`;
                            
                            if (secondDown.ttnt === '0') {
                                document.getElementById('ttnt_down2').innerText = '即將到站';
                                document.getElementById('unit_down2').innerText = '';
                            } else {
                                document.getElementById('ttnt_down2').innerText = secondDown.ttnt;
                                document.getElementById('unit_down2').innerText = '分';
                            }
                        } else {
                            document.getElementById('dest_down2').innerText = '暫無下班車';
                            document.getElementById('plat_down2').innerText = '';
                            document.getElementById('ttnt_down2').innerText = '--';
                            document.getElementById('unit_down2').innerText = '';
                        }
                    } else {
                        document.getElementById('dest_down1').innerText = '暫無班次';
                        document.getElementById('ttnt_down1').innerText = '--';
                        document.getElementById('unit_down1').innerText = '';
                    }

                    // --- 2. 處理往康城方向列車 (UP) ---
                    if (mtrData.UP && mtrData.UP.length > 0) {
                        const upTrains = mtrData.UP;

                        // 第一班車
                        const firstUp = upTrains[0];
                        document.getElementById('dest_up1').innerText = destNames[firstUp.dest] || `往 康城`;
                        document.getElementById('plat_up1').innerText = `${firstUp.plat} 號月台`;

                        if (firstUp.ttnt === '0' || firstUp.ttnt === '') {
                            firstUpTargetTime = null;
                            isFirstUpArriving = true;
                            document.getElementById('ttnt_up1').innerText = '即將到站';
                            document.getElementById('unit_up1').innerText = '';
                        } else if (firstUp.time) {
                            isFirstUpArriving = false;
                            const targetTimeStr = firstUp.time.replace(/-/g, '/') + ' +0800';
                            firstUpTargetTime = new Date(targetTimeStr).getTime();
                            updateCountdownUI(firstUpTargetTime, false, 'ttnt_up1', 'unit_up1');
                        }

                        // 第二班車
                        if (upTrains.length > 1) {
                            const secondUp = upTrains[1];
                            document.getElementById('dest_up2').innerText = destNames[secondUp.dest] || `往 康城`;
                            document.getElementById('plat_up2').innerText = `${secondUp.plat} 號月台`;
                            
                            if (secondUp.ttnt === '0') {
                                document.getElementById('ttnt_up2').innerText = '即將到站';
                                document.getElementById('unit_up2').innerText = '';
                            } else {
                                document.getElementById('ttnt_up2').innerText = secondUp.ttnt;
                                document.getElementById('unit_up2').innerText = '分';
                            }
                        } else {
                            document.getElementById('dest_up2').innerText = '暫無下班車';
                            document.getElementById('plat_up2').innerText = '';
                            document.getElementById('ttnt_up2').innerText = '--';
                            document.getElementById('unit_up2').innerText = '';
                        }
                    } else {
                        document.getElementById('dest_up1').innerText = '暫無抵站列車';
                        document.getElementById('ttnt_up1').innerText = '--';
                        document.getElementById('unit_up1').innerText = '';
                    }

                } else {
                    document.getElementById('dest_down1').innerText = '暫無列車資料';
                    document.getElementById('dest_up1').innerText = '暫無列車資料';
                }
            } catch (error) {
                console.error(error);
            }
        }

        // 啟動與重置計時器的封裝函數
        function startIntervals() {
            if (fetchIntervalId) clearInterval(fetchIntervalId);
            fetchMTRData(); // 立即攞一次
            fetchIntervalId = setInterval(fetchMTRData, 10000); // 之後每 10 秒攞一次
        }

        // 監聽網頁可見度 (解決鎖屏/轉App導致的時間停頓)
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                startIntervals();
            }
        });

        // 初始化執行
        loadTodayCatholicVerse();
        fetchHKOWeather();
        startIntervals();

        // 每秒本地倒數
        setInterval(tickFirstTrainCountdown, 1000);
        // 天氣維持 5 分鐘刷新
        setInterval(fetchHKOWeather, 300000);
    </script>
</body>
</html>
