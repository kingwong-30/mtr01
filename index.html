<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>康城及將軍澳綫即時列車及資訊儀表板</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --highlight-color: #f59e0b;
            --mtr-purple: #8b5cf6;
            --inbound-color: #34d399;
            --error-color: #f87171;
            --warning-bg: rgba(245, 158, 11, 0.2);
            --warning-border: rgba(245, 158, 11, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* 每日聖言卡片 */
        .scripture-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border-color: #4338ca;
        }

        .scripture-main-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .scripture-date {
            font-size: 0.78rem;
            color: #a5b4fc;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .scripture-reading {
            font-size: 0.88rem;
            color: #c7d2fe;
            margin-bottom: 8px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        .scripture-content {
            font-size: 0.92rem;
            line-height: 1.6;
            color: #e0e7ff;
            font-weight: 400;
            white-space: pre-line;
        }

        /* 預設摺疊 (最多顯示 2 行) */
        .scripture-content.collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 展開 / 收起按鈕 */
        .scripture-toggle-btn {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.78rem;
            color: #a5b4fc;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        .scripture-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        /* 天氣資訊卡片 */
        .weather-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .weather-icon {
            font-size: 2.2rem;
        }

        .temp-display {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .weather-details {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .weather-warnings {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 2px;
        }

        .warning-badge {
            background-color: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: var(--highlight-color);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* 港鐵卡片 */
        .mtr-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mtr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .station-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .station-badge {
            background-color: var(--mtr-purple);
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .update-time {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-error {
            color: var(--error-color);
            font-weight: bold;
        }

        .direction-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .direction-label.inbound {
            color: var(--inbound-color);
        }

        .station-btn-group {
            display: flex;
            gap: 6px;
        }

        .btn-station {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-sub);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            min-height: 36px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-station:active {
            transform: scale(0.95);
        }

        .btn-station:hover {
            background-color: rgba(52, 211, 153, 0.15);
            color: var(--inbound-color);
        }

        .btn-station.active {
            background-color: rgba(52, 211, 153, 0.22);
            color: var(--inbound-color);
            border-color: var(--inbound-color);
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.3);
        }

        .train-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .train-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .train-dest {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dest-badge {
            font-size: 0.72rem;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .dest-badge.direct {
            background-color: rgba(52, 211, 153, 0.25);
            color: var(--inbound-color);
            border: 1px solid rgba(52, 211, 153, 0.4);
        }

        .dest-badge.transfer {
            background-color: rgba(245, 158, 11, 0.2);
            color: var(--highlight-color);
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .train-plat {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .train-time-wrap {
            text-align: right;
        }

        .exact-time {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 500;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; color: var(--error-color); }
            100% { opacity: 1; }
        }
        
        .arriving-text {
            animation: pulse 1.5s infinite;
            color: var(--error-color) !important;
            font-size: 1.3rem !important;
            font-weight: 800;
        }

        .train-item.first-train {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .train-item.first-train.inbound-bg {
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .first-train .train-time {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1;
        }

        .first-train.inbound-bg .train-time {
            color: var(--inbound-color);
        }

        .first-train .train-unit {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-left: 2px;
        }

        .first-train.inbound-bg .train-unit {
            color: var(--inbound-color);
        }

        .train-item.second-train {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .second-train .train-dest {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .second-train .train-time {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .second-train .train-unit {
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
       

        <!-- 天氣資訊 -->
        <div class="card weather-card">
            <div class="weather-main">
                <div class="weather-info">
                    <div id="weather-icon" class="weather-icon">🌤️</div>
                    <div id="temp" class="temp-display">--°C</div>
                </div>
                <div class="weather-details">
                    <div>將軍澳天氣</div>
                    <div>相對濕度: <span id="humidity">--%</span></div>
                </div>
            </div>
            <div id="weather-warnings" class="weather-warnings"></div>
        </div>

        <!-- 卡片 1: 由康城站往調景嶺/市區 -->
        <div class="card mtr-card">
            <div class="mtr-header">
                <div class="station-title">
                    康城站 <span class="station-badge">將軍澳綫</span>
                </div>
                <div class="update-time">
                    <span id="network-status-c1"></span>
                    <span id="updated-c1">最後更新 --:--</span>
                </div>
            </div>

            <div class="train-section">
                <div class="direction-label">
                    <span>🚆 由 康城站 往 調景嶺 / 北角</span>
                </div>
                <div class="train-list">
                    <div class="train-item first-train">
                        <div>
                            <div id="dest_c1_1" class="train-dest">載入中...</div>
                            <div id="plat_c1_1" class="train-plat">-- 月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_c1_1" class="train-time">--</span><span id="unit_c1_1" class="train-unit"></span>
                            <span id="exact_c1_1" class="exact-time"></span>
                        </div>
                    </div>
                    <div class="train-item second-train">
                        <div>
                            <div id="dest_c1_2" class="train-dest">載入中...</div>
                            <div id="plat_c1_2" class="train-plat">-- 月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_c1_2" class="train-time">--</span><span id="unit_c1_2" class="train-unit"></span>
                            <span id="exact_c1_2" class="exact-time"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 卡片 2: 由調景嶺/將軍澳/北角往康城 -->
        <div class="card mtr-card">
            <div class="mtr-header">
                <div class="station-title">
                    <span id="card2-station-title">調景嶺站</span> <span class="station-badge">將軍澳綫</span>
                </div>
                <div class="update-time">
                    <span id="network-status-c2"></span>
                    <span id="updated-c2">最後更新 --:--</span>
                </div>
            </div>

            <div class="train-section">
                <div class="direction-label inbound">
                    <span id="card2-direction-label">🏁 由 調景嶺站 往 康城</span>
                    <div class="station-btn-group">
                        <button id="btn-tik" class="btn-station" onclick="selectCard2Station('TIK')">調景嶺</button>
                        <button id="btn-tko" class="btn-station" onclick="selectCard2Station('TKO')">將軍澳</button>
                        <button id="btn-nop" class="btn-station" onclick="selectCard2Station('NOP')">北角</button>
                    </div>
                </div>
                <div class="train-list">
                    <div class="train-item first-train inbound-bg">
                        <div>
                            <div id="dest_c2_1" class="train-dest">載入中...</div>
                            <div id="plat_c2_1" class="train-plat">-- 月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_c2_1" class="train-time">--</span><span id="unit_c2_1" class="train-unit"></span>
                            <span id="exact_c2_1" class="exact-time"></span>
                        </div>
                    </div>
                    <div class="train-item second-train">
                        <div>
                            <div id="dest_c2_2" class="train-dest">載入中...</div>
                            <div id="plat_c2_2" class="train-plat">-- 月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_c2_2" class="train-time">--</span><span id="unit_c2_2" class="train-unit"></span>
                            <span id="exact_c2_2" class="exact-time"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dom = {};
        const STORAGE_KEY = 'mtr_card2_selected_station';
        let card2Station = localStorage.getItem(STORAGE_KEY) || 'TIK';

        const stationNames = { 'TIK': '調景嶺站', 'TKO': '將軍澳站', 'NOP': '北角站' };
        const destNames = { 'NOP': '往 北角', 'TIK': '往 調景嶺', 'LHP': '往 康城', 'TKO': '往 將軍澳', 'POA': '往 寶琳' };

        let isScriptureExpanded = false;
        let firstC1TargetTime = null;
        let firstC2TargetTime = null;
        let isFirstC1Arriving = false;
        let isFirstC2Arriving = false;
        let timeOffset = 0;

        function cacheDOM() {
            const ids = [
                'scripture-title-text', 'scripture-date', 'scripture-reading', 'scripture', 
                'scripture-toggle-btn', 'weather-icon', 'temp', 'humidity', 
                'weather-warnings', 'network-status-c1', 'updated-c1', 'network-status-c2', 
                'updated-c2', 'card2-station-title', 'card2-direction-label',
                'dest_c1_1', 'plat_c1_1', 'ttnt_c1_1', 'unit_c1_1', 'exact_c1_1',
                'dest_c1_2', 'plat_c1_2', 'ttnt_c1_2', 'unit_c1_2', 'exact_c1_2',
                'dest_c2_1', 'plat_c2_1', 'ttnt_c2_1', 'unit_c2_1', 'exact_c2_1',
                'dest_c2_2', 'plat_c2_2', 'ttnt_c2_2', 'unit_c2_2', 'exact_c2_2'
            ];
            ids.forEach(id => { dom[id] = document.getElementById(id); });
        }

        // 取得香港當前的 YYYY-MM-DD 日期 Key
        function getHongKongDateKey() {
            const options = { timeZone: 'Asia/Hong_Kong', year: 'numeric', month: '2-digit', day: '2-digit' };
            const formatter = new Intl.DateTimeFormat('en-CA', options);
            return formatter.format(new Date());
        }

        // 從 data.json 載入今日聖言 (已修正問題 4: 重置展開狀態)
        async function loadDailyScriptureFromJSON() {
            try {
                isScriptureExpanded = false; // 重置展開/收起狀態變數
                
                const res = await fetch('./data.json?t=' + Date.now());
                const allData = await res.json();
                
                const todayKey = getHongKongDateKey();
                const today = allData[todayKey];
                
                const titleEl = dom['scripture-title-text'];
                const dateEl = dom['scripture-date'];
                const readingEl = dom['scripture-reading'];
                const scriptureEl = dom['scripture'];
                const toggleBtn = dom['scripture-toggle-btn'];

                if (today) {
                    if (titleEl) titleEl.innerText = today.title || "Daily Gospel Meditation";
                    if (dateEl) dateEl.innerText = today.date || "";
                    if (readingEl) readingEl.innerText = today.reading || "";
                    if (scriptureEl) {
                        scriptureEl.innerText = today.content || "";
                        scriptureEl.classList.add('collapsed'); // 恢復預設摺疊樣式
                    }

                    if (today.content && today.content.length > 80) {
                        if (toggleBtn) {
                            toggleBtn.innerText = '展開全文 🔽';
                            toggleBtn.style.display = 'inline-block';
                        }
                    } else {
                        if (scriptureEl) scriptureEl.classList.remove('collapsed');
                        if (toggleBtn) toggleBtn.style.display = 'none';
                    }
                } else {
                    if (titleEl) titleEl.innerText = "Daily Gospel Meditation";
                    if (readingEl) readingEl.innerText = "";
                    if (scriptureEl) scriptureEl.innerText = "未有找到今日之聖言內容。";
                    if (toggleBtn) toggleBtn.style.display = 'none';
                }
            } catch (error) {
                console.error('無法載入每日聖言 data.json:', error);
                if (dom['scripture']) dom['scripture'].innerText = '載入聖言失敗，請稍後再試。';
            }
        }

        function toggleScripture() {
            const scriptureEl = dom['scripture'];
            const toggleBtn = dom['scripture-toggle-btn'];
            
            isScriptureExpanded = !isScriptureExpanded;

            if (isScriptureExpanded) {
                scriptureEl.classList.remove('collapsed');
                toggleBtn.innerText = '收起內容 🔼';
            } else {
                scriptureEl.classList.add('collapsed');
                toggleBtn.innerText = '展開全文 🔽';
            }
        }

        function selectCard2Station(sta, skipFetch = false) {
            card2Station = sta;
            localStorage.setItem(STORAGE_KEY, sta);

            const staName = stationNames[sta] || '調景嶺站';

            dom['card2-station-title'].innerText = staName;
            dom['card2-direction-label'].innerText = sta === 'NOP' 
                ? `🏁 由 北角站 往 康城 / 寶琳` 
                : `🏁 由 ${staName} 往 康城`;

            ['TIK', 'TKO', 'NOP'].forEach(code => {
                const btn = document.getElementById(`btn-${code.toLowerCase()}`);
                if (btn) {
                    if (code === sta) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
            });

            if (!skipFetch) fetchMTRData();
        }

        function renderDestUI(trainObj) {
            if (!trainObj) return '暫無列車';
            const rawName = destNames[trainObj.dest] || `往 ${trainObj.dest}`;
            
            if (card2Station === 'NOP') {
                if (trainObj.dest === 'LHP') {
                    return `${rawName} <span class="dest-badge direct">直達</span>`;
                } else if (trainObj.dest === 'POA') {
                    return `${rawName} <span class="dest-badge transfer">轉乘</span>`;
                }
            }
            return rawName;
        }

        function parseMTRTime(timeStr) {
            if (!timeStr) return null;
            const isoStr = timeStr.trim().replace(' ', 'T') + '+08:00';
            const timestamp = new Date(isoStr).getTime();
            return isNaN(timestamp) ? null : timestamp;
        }

        function formatExactTime(ms) {
            if (!ms) return '';
            const d = new Date(ms);
            return `(${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')})`;
        }

        function getFormattedCurrentTime() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        async function fetchHKOWeather() {
            try {
                const [rhrRes, warnRes] = await Promise.all([
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc').then(r => r.json()).catch(() => null),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc').then(r => r.json()).catch(() => null)
                ]);

                if (rhrRes) {
                    const tkoTemp = rhrRes.temperature?.data.find(t => t.place.includes('將軍澳')) || rhrRes.temperature?.data[0];
                    if (tkoTemp) dom['temp'].innerText = `${tkoTemp.value}°C`;
                    if (rhrRes.humidity?.data?.[0]) dom['humidity'].innerText = `${rhrRes.humidity.data[0].value}%`;
                    
                    const iconMap = { 50:"☀️", 51:"⛅", 53:"🌤️", 60:"☁️", 62:"🌧️", 65:"⛈️", 70:"🌙" };
                    dom['weather-icon'].innerText = iconMap[rhrRes.icon?.[0]] || "🌤️";
                }

                const warnContainer = dom['weather-warnings'];
                if (warnContainer) {
                    warnContainer.innerHTML = '';
                    if (warnRes && Object.keys(warnRes).length > 0) {
                        Object.values(warnRes).forEach(w => {
                            if (w && w.name) {
                                const badge = document.createElement('span');
                                badge.className = 'warning-badge';
                                badge.innerHTML = `⚠️ ${w.name}`;
                                warnContainer.appendChild(badge);
                            }
                        });
                    }
                }
            } catch (error) { 
                console.error('Weather Fetch Error:', error); 
            }
        }

        function updateCountdownUI(targetTime, isArriving, ttntId, unitId, exactId) {
            const elTtnt = dom[ttntId];
            const elUnit = dom[unitId];
            const elExact = dom[exactId];

            if (isArriving || (targetTime && (targetTime - (Date.now() + timeOffset) <= 0))) {
                elTtnt.innerText = '即將到站';
                elTtnt.className = 'train-time arriving-text';
                elUnit.innerText = '';
                elExact.innerText = '';
            } else if (targetTime) {
                const diffSec = Math.floor((targetTime - (Date.now() + timeOffset)) / 1000);
                const mins = Math.ceil(diffSec / 60);
                
                elTtnt.innerText = mins;
                elTtnt.className = 'train-time';
                elUnit.innerText = '分';
                elExact.innerText = formatExactTime(targetTime);
            } else {
                elTtnt.innerText = '--';
                elTtnt.className = 'train-time';
                elUnit.innerText = '';
                elExact.innerText = '';
            }
        }

        function tickFirstTrainCountdown() {
            updateCountdownUI(firstC1TargetTime, isFirstC1Arriving, 'ttnt_c1_1', 'unit_c1_1', 'exact_c1_1');
            updateCountdownUI(firstC2TargetTime, isFirstC2Arriving, 'ttnt_c2_1', 'unit_c2_1', 'exact_c2_1');
        }

        function setEmptyState(cardPrefix, index, msg) {
            dom[`dest_${cardPrefix}_${index}`].innerHTML = msg;
            dom[`plat_${cardPrefix}_${index}`].innerText = '-- 月台';
            dom[`ttnt_${cardPrefix}_${index}`].innerText = '--';
            dom[`unit_${cardPrefix}_${index}`].innerText = '';
            dom[`exact_${cardPrefix}_${index}`].innerText = '';
            dom[`ttnt_${cardPrefix}_${index}`].className = 'train-time';
        }

        // 載入港鐵資料 (已修正問題 2: 正確處理連線異常)
        async function fetchMTRData() {
            const requestStartTime = Date.now();
            
            try {
                const [resLHP, resCard2] = await Promise.all([
                    fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP`).then(r => r.json()).catch(() => null),
                    fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=${card2Station}`).then(r => r.json()).catch(() => null)
                ]);

                // 若網絡異常或 API 失敗回傳 null，拋出錯誤進入 catch 區塊顯示連線警告
                if (!resLHP || !resCard2) {
                    throw new Error('MTR API 連線失敗或網絡異常');
                }

                dom['network-status-c1'].innerText = '';
                dom['network-status-c2'].innerText = '';
                const rtt = Date.now() - requestStartTime;

                const currTimeMs = resLHP?.curr_time ? parseMTRTime(resLHP.curr_time) : null;
                const updateTimeString = resLHP?.curr_time ? `最後更新 ${resLHP.curr_time.split(' ')[1].substring(0,5)}` : `最後更新 ${getFormattedCurrentTime()}`;

                if (currTimeMs) {
                    timeOffset = (currTimeMs + (rtt / 2)) - Date.now();
                }
                dom['updated-c1'].innerText = updateTimeString;
                dom['updated-c2'].innerText = updateTimeString;

                // --- 1. 卡片一：由康城站往調景嶺/北角 ---
                const lhpDownTrains = resLHP?.data?.['TKL-LHP']?.DOWN;
                if (resLHP?.status === 1 && lhpDownTrains && lhpDownTrains.length > 0) {
                    dom['dest_c1_1'].innerHTML = destNames[lhpDownTrains[0].dest] || `往 ${lhpDownTrains[0].dest}`;
                    dom['plat_c1_1'].innerText = `${lhpDownTrains[0].plat} 月台`;
                    if (lhpDownTrains[0].ttnt === '0' || !lhpDownTrains[0].time) {
                        isFirstC1Arriving = true;
                        firstC1TargetTime = null;
                    } else {
                        isFirstC1Arriving = false;
                        firstC1TargetTime = parseMTRTime(lhpDownTrains[0].time);
                    }

                    if (lhpDownTrains.length > 1) {
                        dom['dest_c1_2'].innerHTML = destNames[lhpDownTrains[1].dest] || `往 ${lhpDownTrains[1].dest}`;
                        dom['plat_c1_2'].innerText = `${lhpDownTrains[1].plat} 月台`;
                        const t2Time = parseMTRTime(lhpDownTrains[1].time);
                        updateCountdownUI(t2Time, lhpDownTrains[1].ttnt === '0', 'ttnt_c1_2', 'unit_c1_2', 'exact_c1_2');
                    } else {
                        setEmptyState('c1', 2, '暫無下班車');
                    }
                } else {
                    setEmptyState('c1', 1, '非服務時間');
                    setEmptyState('c1', 2, '非服務時間');
                    isFirstC1Arriving = false;
                    firstC1TargetTime = null;
                }

                // --- 2. 卡片二：調景嶺/將軍澳/北角上行 ---
                const card2DataKey = `TKL-${card2Station}`;
                let card2UpTrains = resCard2?.data?.[card2DataKey]?.UP || [];
                
                if (card2Station !== 'NOP') {
                    card2UpTrains = card2UpTrains.filter(t => t.dest === 'LHP');
                }

                if (resCard2?.status === 1 && card2UpTrains.length > 0) {
                    dom['dest_c2_1'].innerHTML = renderDestUI(card2UpTrains[0]);
                    dom['plat_c2_1'].innerText = `${card2UpTrains[0].plat} 月台`;
                    if (card2UpTrains[0].ttnt === '0' || !card2UpTrains[0].time) {
                        isFirstC2Arriving = true;
                        firstC2TargetTime = null;
                    } else {
                        isFirstC2Arriving = false;
                        firstC2TargetTime = parseMTRTime(card2UpTrains[0].time);
                    }

                    if (card2UpTrains.length > 1) {
                        dom['dest_c2_2'].innerHTML = renderDestUI(card2UpTrains[1]);
                        dom['plat_c2_2'].innerText = `${card2UpTrains[1].plat} 月台`;
                        const t2Time = parseMTRTime(card2UpTrains[1].time);
                        updateCountdownUI(t2Time, card2UpTrains[1].ttnt === '0', 'ttnt_c2_2', 'unit_c2_2', 'exact_c2_2');
                    } else {
                        setEmptyState('c2', 2, '暫無下班車');
                    }
                } else {
                    setEmptyState('c2', 1, '暫無列車服務');
                    setEmptyState('c2', 2, '暫無下班車');
                    isFirstC2Arriving = false;
                    firstC2TargetTime = null;
                }

                tickFirstTrainCountdown();

            } catch (error) {
                console.error('MTR Fetch Error:', error);
                dom['network-status-c1'].innerText = '⚠️ 連線異常 | ';
                dom['network-status-c1'].className = 'status-error';
                dom['network-status-c2'].innerText = '⚠️ 連線異常 | ';
                dom['network-status-c2'].className = 'status-error';
            }
        }

        function initDashboard() {
            cacheDOM();
            selectCard2Station(card2Station, true);
            loadDailyScriptureFromJSON();
            fetchHKOWeather();
            fetchMTRData();

            setInterval(tickFirstTrainCountdown, 1000);
            setInterval(fetchMTRData, 25000);
            setInterval(fetchHKOWeather, 300000);
        }

        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
