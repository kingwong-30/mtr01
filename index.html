<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>康城站列車時間 & 實時天氣 & 聖經金句</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "PingFang HK", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 8px 18px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* 頂部實時資訊欄 (日期、時間、天氣) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000000;
            padding-bottom: 6px;
            font-weight: 800;
            font-size: 1rem;
        }
        .top-left { text-align: left; }
        .top-center {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 900;
        }
        .top-right {
            text-align: right;
            font-size: 1.1rem;
        }

        /* 車站標題 */
        .header {
            text-align: center;
            border-bottom: 3px solid #000000;
            padding: 6px 0;
            margin-top: 4px;
        }
        .station-title {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* 列車列表 */
        .train-list {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }
        .train-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }
        .train-row:not(:last-child) {
            border-bottom: 2px dashed #000000;
        }
        .destination {
            font-weight: 900;
            line-height: 1.2;
        }
        .platform {
            font-size: 0.95rem;
            font-weight: 700;
            margin-top: 4px;
        }
        .time-box {
            text-align: right;
            white-space: nowrap;
        }
        .time-val {
            font-weight: 900;
            line-height: 1;
        }
        
        /* 第一班車：大字體 */
        .first-train .destination { font-size: 1.8rem; }
        .first-train .time-val { font-size: 3.8rem; }

        /* 第二班車：次要大小 */
        .second-train .destination { font-size: 1.4rem; }
        .second-train .time-val { font-size: 2.5rem; }

        .time-unit {
            font-size: 1rem;
            font-weight: 800;
            margin-left: 2px;
        }

        /* 每日英文聖經金句區塊 */
        .bible-box {
            border-top: 2px solid #000000;
            padding-top: 8px;
            margin-top: 4px;
            text-align: center;
        }
        .bible-text {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 0.95rem;
            font-style: italic;
            line-height: 1.3;
            color: #000000;
        }
        .bible-ref {
            font-family: "PingFang HK", Arial, sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            font-style: normal;
            margin-top: 4px;
        }

        .status {
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            border-top: 1px solid #000000;
            padding-top: 6px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <!-- 頂部資訊欄：日期、實時時間、天氣氣溫與圖案 -->
    <div class="top-bar">
        <div id="date-display" class="top-left">----/--/--</div>
        <div id="clock-display" class="top-center">00:00</div>
        <div id="weather-display" class="top-right">--°C --</div>
    </div>

    <div class="header">
        <div class="station-title">康城 LOHAS PARK</div>
    </div>

    <div class="train-list">
        <!-- 第一班車 -->
        <div class="train-row first-train">
            <div class="train-info">
                <div id="dest1" class="destination">載入中...</div>
                <div id="plat1" class="platform">-- 號月台</div>
            </div>
            <div class="time-box">
                <span id="ttnt1" class="time-val">--</span><span id="unit1" class="time-unit">分</span>
            </div>
        </div>

        <!-- 第二班車 -->
        <div class="train-row second-train">
            <div class="train-info">
                <div id="dest2" class="destination">--</div>
                <div id="plat2" class="platform">-- 號月台</div>
            </div>
            <div class="time-box">
                <span id="ttnt2" class="time-val">--</span><span id="unit2" class="time-unit">分</span>
            </div>
        </div>
    </div>

    <!-- 每日英文聖經金句 -->
    <div class="bible-box">
        <div id="bible-text" class="bible-text">"Trust in the LORD with all your heart and lean not on your own understanding."</div>
        <div id="bible-ref" class="bible-ref">— Proverbs 3:5</div>
    </div>

    <div id="updated" class="status">更新中...</div>

<script>
    const destNames = {
        'NOP': '往 北角',
        'TIK': '往 調景嶺',
        'LHP': '康城',
        'TKO': '將軍澳'
    };

    // 內置精選英文金句庫（當 API 連線失敗時自動使用，確保 100% 有內容）
    const fallbackVerses = [
        { text: "Trust in the LORD with all your heart and lean not on your own understanding.", ref: "Proverbs 3:5" },
        { text: "The LORD is my shepherd; I shall not want.", ref: "Psalm 23:1" },
        { text: "I can do all this through him who gives me strength.", ref: "Philippians 4:13" },
        { text: "For God so loved the world that he gave his one and only Son.", ref: "John 3:16" },
        { text: "Be strong and courageous. Do not be afraid; do not be discouraged.", ref: "Joshua 1:9" },
        { text: "The Lord is my light and my salvation—whom shall I fear?", ref: "Psalm 27:1" },
        { text: "Cast all your anxiety on him because he cares for you.", ref: "1 Peter 5:7" }
    ];

    // 強制計算香港時間 (HKT UTC+8)
    function getHKDate() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        return new Date(utc + (3600000 * 8));
    }

    // 更新日期與實時時鐘
    function updateClockAndDate() {
        const hkTime = getHKDate();
        const month = hkTime.getMonth() + 1;
        const date = hkTime.getDate();
        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
        const dayOfWeek = weekDays[hkTime.getDay()];
        document.getElementById('date-display').innerText = `${month}月${date}日 (${dayOfWeek})`;

        const hh = hkTime.getHours().toString().padStart(2, '0');
        const mm = hkTime.getMinutes().toString().padStart(2, '0');
        document.getElementById('clock-display').innerText = `${hh}:${mm}`;
    }

    // 抓取天文台氣溫與天氣圖案
    async function fetchHKOWeather() {
        try {
            const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
            const data = await response.json();

            let temp = '--';
            if (data.temperature && data.temperature.data) {
                const tkoTemp = data.temperature.data.find(t => t.place === "將軍澳");
                temp = tkoTemp ? tkoTemp.value : data.temperature.data[0].value;
            }

            let iconSymbol = '☀️';
            if (data.icon && data.icon.length > 0) {
                const code = data.icon[0];
                if ([53, 54, 62, 63, 64, 65].includes(code)) iconSymbol = '🌧️';
                else if ([50, 51, 52].includes(code)) iconSymbol = '☀️';
                else if ([60, 61].includes(code)) iconSymbol = '☁️';
                else if ([66, 67].includes(code)) iconSymbol = '⚡';
                else iconSymbol = '⛅';
            }

            document.getElementById('weather-display').innerText = `${temp}°C ${iconSymbol}`;
        } catch (error) {
            document.getElementById('weather-display').innerText = `--°C`;
        }
    }

    // 抓取每日英文聖經金句 (Bible API)
    async function fetchDailyBibleVerse() {
        try {
            // 使用 labs.bible.org 每日金句 API
            const response = await fetch('https://labs.bible.org/api/?passage=votd&type=json');
            const data = await response.json();

            if (data && data.length > 0) {
                const verse = data[0];
                document.getElementById('bible-text').innerText = `"${verse.text.trim()}"`;
                document.getElementById('bible-ref').innerText = `— ${verse.bookname} ${verse.chapter}:${verse.verse}`;
                return;
            }
        } catch (e) {
            console.log('Bible API fallback used');
        }

        // 若 API 失敗，根據日期輪播備用金句
        const dayOfYear = Math.floor((getHKDate() - new Date(getHKDate().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
        const selected = fallbackVerses[dayOfYear % fallbackVerses.length];
        document.getElementById('bible-text').innerText = `"${selected.text}"`;
        document.getElementById('bible-ref').innerText = `— ${selected.ref}`;
    }

    // 抓取港鐵康城站時間
    async function fetchMTRData() {
        try {
            const response = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP');
            const data = await response.json();

            if (data.status === 1 && data.data['TKL-LHP'] && data.data['TKL-LHP'].DOWN) {
                const trains = data.data['TKL-LHP'].DOWN;

                if (trains.length > 0) {
                    updateTrainSlot(trains[0], 1);
                } else {
                    document.getElementById('dest1').innerText = '暫無班次';
                }

                if (trains.length > 1) {
                    updateTrainSlot(trains[1], 2);
                } else {
                    document.getElementById('dest2').innerText = '暫無下班車';
                    document.getElementById('plat2').innerText = '';
                    document.getElementById('ttnt2').innerText = '--';
                    document.getElementById('unit2').innerText = '';
                }

                if (data.curr_time) {
                    const timeOnly = data.curr_time.split(' ')[1];
                    document.getElementById('updated').innerText = `最後更新 ${timeOnly}`;
                }
            } else {
                document.getElementById('dest1').innerText = '暫無資料';
            }
        } catch (error) {
            document.getElementById('dest1').innerText = '連線失敗';
        }
    }

    function updateTrainSlot(train, slotNum) {
        const destCode = train.dest;
        const minutes = train.ttnt;
        const platform = train.plat;

        document.getElementById(`dest${slotNum}`).innerText = destNames[destCode] || `往 ${destCode}`;
        document.getElementById(`plat${slotNum}`).innerText = `${platform} 號月台`;

        if (minutes === '0') {
            document.getElementById(`ttnt${slotNum}`).innerText = '即將到站';
            document.getElementById(`unit${slotNum}`).innerText = '';
        } else {
            document.getElementById(`ttnt${slotNum}`).innerText = minutes;
            document.getElementById(`unit${slotNum}`).innerText = '分';
        }
    }

    // 初始化與定時器
    updateClockAndDate();
    setInterval(updateClockAndDate, 1000);

    fetchHKOWeather();
    setInterval(fetchHKOWeather, 600000);

    fetchDailyBibleVerse();
    setInterval(fetchDailyBibleVerse, 86400000); // 金句每日更新一次

    fetchMTRData();
    setInterval(fetchMTRData, 30000);
</script>

</body>
</html>
