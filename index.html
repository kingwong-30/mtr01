<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>康城及將軍澳綫即時列車及資訊儀表板</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --highlight-color: #f59e0b;
            --mtr-purple: #8b5cf6;
            --inbound-color: #34d399;
            --error-color: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* 每日聖言卡片 */
        .scripture-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border-color: #4338ca;
        }

        .scripture-title {
            font-size: 0.8rem;
            color: #a5b4fc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scripture-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e0e7ff;
            font-weight: 400;
        }

        .scripture-ref {
            font-size: 0.8rem;
            color: #818cf8;
            margin-top: 8px;
            text-align: right;
            font-style: italic;
            font-weight: 600;
        }

        /* 天氣資訊卡片 */
        .weather-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .weather-icon {
            font-size: 2.2rem;
        }

        .temp-display {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .weather-details {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* 港鐵卡片 */
        .mtr-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mtr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .station-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .station-badge {
            background-color: var(--mtr-purple);
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .update-time {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-error {
            color: var(--error-color);
            font-weight: bold;
        }

        /* 方向標題與切換按鈕 */
        .direction-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .direction-label.inbound {
            color: var(--inbound-color);
        }

        .toggle-btn {
            background-color: rgba(56, 189, 248, 0.12);
            color: var(--accent-color);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .toggle-btn:hover {
            background-color: rgba(56, 189, 248, 0.25);
            border-color: rgba(56, 189, 248, 0.5);
        }

        .toggle-btn:active {
            transform: scale(0.96);
        }

        .train-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .train-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .train-dest {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .train-plat {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .train-time-wrap {
            text-align: right;
        }

        .exact-time {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 500;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; color: var(--error-color); }
            100% { opacity: 1; }
        }
        
        .arriving-text {
            animation: pulse 1.5s infinite;
            color: var(--error-color) !important;
            font-size: 1.3rem !important;
            font-weight: 800;
        }

        .train-item.first-train {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .train-item.first-train.inbound-bg {
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .first-train .train-time {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1;
        }

        .first-train.inbound-bg .train-time {
            color: var(--inbound-color);
        }

        .first-train .train-unit {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-left: 2px;
        }

        .first-train.inbound-bg .train-unit {
            color: var(--inbound-color);
        }

        .train-item.second-train {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .second-train .train-dest {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .second-train .train-time {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .second-train .train-unit {
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 每日天主聖言 -->
        <div class="card scripture-card">
            <div class="scripture-title">
                <span>✝️ Daily Gospel</span>
                <span style="font-size:0.7rem; opacity:0.8;">Saint Matthew</span>
            </div>
            <div id="scripture" class="scripture-content">即時載入每日福音中...</div>
            <div id="scripture-ref" class="scripture-ref"></div>
        </div>

        <!-- 天氣資訊 -->
        <div class="card weather-card">
            <div class="weather-info">
                <div id="weather-icon" class="weather-icon">🌤️</div>
                <div id="temp" class="temp-display">--°C</div>
            </div>
            <div class="weather-details">
                <div>將軍澳天氣</div>
                <div>相對濕度: <span id="humidity">--%</span></div>
            </div>
        </div>

        <!-- 卡片 1: 由康城站往調景嶺/市區 -->
        <div class="card mtr-card">
            <div class="mtr-header">
                <div class="station-title">
                    康城站 <span class="station-badge">將軍澳綫</span>
                </div>
                <div class="update-time">
                    <span id="network-status-c1"></span>
                    <span id="updated-c1">最後更新 --:--</span>
                </div>
            </div>

            <div class="train-section">
                <div class="direction-label">
                    <span>🚆 由 康城站 往 調景嶺 / 北角</span>
                </div>
                <div class="train-list">
                    <div class="train-item first-train">
                        <div>
                            <div id="dest_c1_1" class="train-dest">載入中...</div>
                            <div id="plat_c1_1" class="train-plat">-- 月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_c1_1" class="train-time">--</span><span id="unit_c1_1" class="train-unit"></span>
                            <span id="exact_c1_1" class="exact-time"></span>
                        </div>
                    </div>
                    <div class="train-item second-train">
                        <div>
                            <div id="dest_c1_2" class="train-dest">載入中...</div>
                            <div id="plat_c1_2" class="train-plat">-- 月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_c1_2" class="train-time">--</span><span id="unit_c1_2" class="train-unit"></span>
                            <span id="exact_c1_2" class="exact-time"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 卡片 2: 由調景嶺/將軍澳往康城 (支援動態切換) -->
        <div class="card mtr-card">
            <div class="mtr-header">
                <div class="station-title">
                    <span id="card2-station-title">調景嶺站</span> <span class="station-badge">將軍澳綫</span>
                </div>
                <div class="update-time">
                    <span id="network-status-c2"></span>
                    <span id="updated-c2">最後更新 --:--</span>
                </div>
            </div>

            <div class="train-section">
                <div class="direction-label inbound">
                    <span id="card2-direction-label">🏁 由 調景嶺站 往 康城</span>
                    <button id="toggle-c2-btn" class="toggle-btn" onclick="toggleCard2Station()">⇄ 切換至將軍澳站</button>
                </div>
                <div class="train-list">
                    <div class="train-item first-train inbound-bg">
                        <div>
                            <div id="dest_c2_1" class="train-dest">載入中...</div>
                            <div id="plat_c2_1" class="train-plat">-- 月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_c2_1" class="train-time">--</span><span id="unit_c2_1" class="train-unit"></span>
                            <span id="exact_c2_1" class="exact-time"></span>
                        </div>
                    </div>
                    <div class="train-item second-train">
                        <div>
                            <div id="dest_c2_2" class="train-dest">載入中...</div>
                            <div id="plat_c2_2" class="train-plat">-- 月台</div>
                        </div>
                        <div class="train-time-wrap">
                            <span id="ttnt_c2_2" class="train-time">--</span><span id="unit_c2_2" class="train-unit"></span>
                            <span id="exact_c2_2" class="exact-time"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dom = {};
        let card2Station = 'TIK'; // 預設起點站: TIK (調景嶺), 可切換為 TKO (將軍澳)

        function cacheDOM() {
            const ids = [
                'scripture', 'scripture-ref', 'weather-icon', 'temp', 'humidity',
                'network-status-c1', 'updated-c1', 'network-status-c2', 'updated-c2',
                'card2-station-title', 'card2-direction-label', 'toggle-c2-btn',
                'dest_c1_1', 'plat_c1_1', 'ttnt_c1_1', 'unit_c1_1', 'exact_c1_1',
                'dest_c1_2', 'plat_c1_2', 'ttnt_c1_2', 'unit_c1_2', 'exact_c1_2',
                'dest_c2_1', 'plat_c2_1', 'ttnt_c2_1', 'unit_c2_1', 'exact_c2_1',
                'dest_c2_2', 'plat_c2_2', 'ttnt_c2_2', 'unit_c2_2', 'exact_c2_2'
            ];
            ids.forEach(id => {
                dom[id] = document.getElementById(id);
            });
        }

        let firstC1TargetTime = null;
        let firstC2TargetTime = null;
        let isFirstC1Arriving = false;
        let isFirstC2Arriving = false;
        let timeOffset = 0; 
        
        const destNames = { 'NOP': '往 北角', 'TIK': '往 調景嶺', 'LHP': '往 康城', 'TKO': '往 將軍澳' };
        const matthewPassages = [ "1:21", "2:11", "3:17", "5:3-12", "6:9-13", "7:7-8", "11:28-30", "16:24", "28:18-20" ];

        function toggleCard2Station() {
            if (card2Station === 'TIK') {
                card2Station = 'TKO';
                dom['card2-station-title'].innerText = '將軍澳站';
                dom['card2-direction-label'].innerText = '🏁 由 將軍澳站 往 康城';
                dom['toggle-c2-btn'].innerText = '⇄ 切換至調景嶺站';
            } else {
                card2Station = 'TIK';
                dom['card2-station-title'].innerText = '調景嶺站';
                dom['card2-direction-label'].innerText = '🏁 由 調景嶺站 往 康城';
                dom['toggle-c2-btn'].innerText = '⇄ 切換至將軍澳站';
            }
            fetchMTRData();
        }

        function parseMTRTime(timeStr) {
            if (!timeStr) return null;
            const isoStr = timeStr.trim().replace(' ', 'T') + '+08:00';
            const timestamp = new Date(isoStr).getTime();
            return isNaN(timestamp) ? null : timestamp;
        }

        function formatExactTime(ms) {
            if (!ms) return '';
            const d = new Date(ms);
            return `(${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')})`;
        }

        function getFormattedCurrentTime() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        async function fetchDailyMatthewGospel() {
            try {
                const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
                const passageRef = matthewPassages[dayOfYear % matthewPassages.length];
                const res = await fetch(`https://bible-api.com/matthew+${passageRef}?translation=web`);
                const data = await res.json();
                if (data && data.text) {
                    dom['scripture'].innerText = `"${data.text.replace(/\n/g, ' ').trim()}"`;
                    dom['scripture-ref'].innerText = `— ${data.reference} (Saint Matthew)`;
                }
            } catch (error) {
                dom['scripture'].innerText = '"Come to me, all you that are weary and are carrying heavy burdens..."';
                dom['scripture-ref'].innerText = '— Matthew 11:28';
            }
        }

        async function fetchHKOWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                if (data) {
                    const tkoTemp = data.temperature?.data.find(t => t.place.includes('將軍澳')) || data.temperature?.data[0];
                    if (tkoTemp) dom['temp'].innerText = `${tkoTemp.value}°C`;
                    if (data.humidity?.data?.[0]) dom['humidity'].innerText = `${data.humidity.data[0].value}%`;
                    
                    const iconMap = { 50:"☀️", 51:"⛅", 53:"🌤️", 60:"☁️", 62:"🌧️", 65:"⛈️", 70:"🌙" };
                    dom['weather-icon'].innerText = iconMap[data.icon?.[0]] || "🌤️";
                }
            } catch (error) { console.error('Weather Fetch Error'); }
        }

        function updateCountdownUI(targetTime, isArriving, ttntId, unitId, exactId) {
            const elTtnt = dom[ttntId];
            const elUnit = dom[unitId];
            const elExact = dom[exactId];

            if (isArriving || (targetTime && (targetTime - (Date.now() + timeOffset) <= 0))) {
                elTtnt.innerText = '即將到站';
                elTtnt.className = 'train-time arriving-text';
                elUnit.innerText = '';
                elExact.innerText = '';
            } else if (targetTime) {
                const diffSec = Math.floor((targetTime - (Date.now() + timeOffset)) / 1000);
                const mins = Math.ceil(diffSec / 60);
                
                elTtnt.innerText = mins;
                elTtnt.className = 'train-time';
                elUnit.innerText = '分';
                elExact.innerText = formatExactTime(targetTime);
            } else {
                elTtnt.innerText = '--';
                elTtnt.className = 'train-time';
                elUnit.innerText = '';
                elExact.innerText = '';
            }
        }

        function tickFirstTrainCountdown() {
            updateCountdownUI(firstC1TargetTime, isFirstC1Arriving, 'ttnt_c1_1', 'unit_c1_1', 'exact_c1_1');
            updateCountdownUI(firstC2TargetTime, isFirstC2Arriving, 'ttnt_c2_1', 'unit_c2_1', 'exact_c2_1');
        }

        function setEmptyState(cardPrefix, index, msg) {
            dom[`dest_${cardPrefix}_${index}`].innerText = msg;
            dom[`plat_${cardPrefix}_${index}`].innerText = '-- 月台';
            dom[`ttnt_${cardPrefix}_${index}`].innerText = '--';
            dom[`unit_${cardPrefix}_${index}`].innerText = '';
            dom[`exact_${cardPrefix}_${index}`].innerText = '';
            dom[`ttnt_${cardPrefix}_${index}`].className = 'train-time';
        }

        async function fetchMTRData() {
            const requestStartTime = Date.now();
            
            try {
                const [resLHP, resCard2] = await Promise.all([
                    fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP`).then(r => r.json()).catch(() => null),
                    fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=${card2Station}`).then(r => r.json()).catch(() => null)
                ]);
                
                dom['network-status-c1'].innerText = '';
                dom['network-status-c2'].innerText = '';
                const rtt = Date.now() - requestStartTime;

                const currTimeMs = resLHP?.curr_time ? parseMTRTime(resLHP.curr_time) : null;
                const updateTimeString = resLHP?.curr_time ? `最後更新 ${resLHP.curr_time.split(' ')[1].substring(0,5)}` : `最後更新 ${getFormattedCurrentTime()}`;

                if (currTimeMs) {
                    timeOffset = (currTimeMs + (rtt / 2)) - Date.now();
                }
                dom['updated-c1'].innerText = updateTimeString;
                dom['updated-c2'].innerText = updateTimeString;

                // --- 1. 卡片一：由康城站往調景嶺/北角 (LHP DOWN) ---
                const lhpDownTrains = resLHP?.data?.['TKL-LHP']?.DOWN;
                if (resLHP?.status === 1 && lhpDownTrains && lhpDownTrains.length > 0) {
                    // 車次 1
                    dom['dest_c1_1'].innerText = destNames[lhpDownTrains[0].dest] || `往 ${lhpDownTrains[0].dest}`;
                    dom['plat_c1_1'].innerText = `${lhpDownTrains[0].plat} 月台`;
                    if (lhpDownTrains[0].ttnt === '0' || !lhpDownTrains[0].time) {
                        isFirstC1Arriving = true;
                        firstC1TargetTime = null;
                    } else {
                        isFirstC1Arriving = false;
                        firstC1TargetTime = parseMTRTime(lhpDownTrains[0].time);
                    }

                    // 車次 2
                    if (lhpDownTrains.length > 1) {
                        dom['dest_c1_2'].innerText = destNames[lhpDownTrains[1].dest] || `往 ${lhpDownTrains[1].dest}`;
                        dom['plat_c1_2'].innerText = `${lhpDownTrains[1].plat} 月台`;
                        const t2Time = parseMTRTime(lhpDownTrains[1].time);
                        updateCountdownUI(t2Time, lhpDownTrains[1].ttnt === '0', 'ttnt_c1_2', 'unit_c1_2', 'exact_c1_2');
                    } else {
                        setEmptyState('c1', 2, '暫無下班車');
                    }
                } else {
                    setEmptyState('c1', 1, '非服務時間');
                    setEmptyState('c1', 2, '非服務時間');
                    isFirstC1Arriving = false;
                    firstC1TargetTime = null;
                }

                // --- 2. 卡片二：由調景嶺/將軍澳往康城 (UP 綫過濾往康城列車) ---
                const card2DataKey = `TKL-${card2Station}`;
                const card2UpTrains = resCard2?.data?.[card2DataKey]?.UP?.filter(t => t.dest === 'LHP') || [];
                
                if (resCard2?.status === 1 && card2UpTrains.length > 0) {
                    // 車次 1
                    dom['dest_c2_1'].innerText = '往 康城';
                    dom['plat_c2_1'].innerText = `${card2UpTrains[0].plat} 月台`;
                    if (card2UpTrains[0].ttnt === '0' || !card2UpTrains[0].time) {
                        isFirstC2Arriving = true;
                        firstC2TargetTime = null;
                    } else {
                        isFirstC2Arriving = false;
                        firstC2TargetTime = parseMTRTime(card2UpTrains[0].time);
                    }

                    // 車次 2
                    if (card2UpTrains.length > 1) {
                        dom['dest_c2_2'].innerText = '往 康城';
                        dom['plat_c2_2'].innerText = `${card2UpTrains[1].plat} 月台`;
                        const t2Time = parseMTRTime(card2UpTrains[1].time);
                        updateCountdownUI(t2Time, card2UpTrains[1].ttnt === '0', 'ttnt_c2_2', 'unit_c2_2', 'exact_c2_2');
                    } else {
                        setEmptyState('c2', 2, '暫無下班車');
                    }
                } else {
                    setEmptyState('c2', 1, '暫無列車往康城');
                    setEmptyState('c2', 2, '暫無下班車');
                    isFirstC2Arriving = false;
                    firstC2TargetTime = null;
                }

                tickFirstTrainCountdown();

            } catch (error) {
                console.error('MTR Fetch Error:', error);
                dom['network-status-c1'].innerText = '⚠️ 連線異常 | ';
                dom['network-status-c1'].className = 'status-error';
                dom['network-status-c2'].innerText = '⚠️ 連線異常 | ';
                dom['network-status-c2'].className = 'status-error';
            }
        }

        function initDashboard() {
            cacheDOM();
            fetchDailyMatthewGospel();
            fetchHKOWeather();
            fetchMTRData();

            setInterval(tickFirstTrainCountdown, 1000);
            setInterval(fetchMTRData, 25000);
            setInterval(fetchHKOWeather, 600000);
        }

        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
